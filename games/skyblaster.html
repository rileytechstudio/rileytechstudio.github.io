<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0c1b">
  <title>Sky Invaders - Flight Shooter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050714;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 30%, #1a1c3b 0%, #050714 100%);
    }

    /* HUD Overlay */
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 12px);
      left: 0;
      width: 100%;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hud-box {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 8px 14px;
      color: #ffffff;
      font-weight: 800;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .hud-btn {
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .hud-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    .score-title {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .lives-container {
      display: flex;
      gap: 5px;
    }

    .life-heart {
      width: 20px;
      height: 20px;
      fill: #ff4757;
      filter: drop-shadow(0 2px 4px rgba(255, 71, 87, 0.5));
    }

    .life-heart.lost {
      fill: #475569;
      filter: none;
      opacity: 0.5;
    }

    /* Game Over & Start & Pause Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 20, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 24px;
      text-align: center;
      color: #ffffff;
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .title {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      max-width: 300px;
      line-height: 1.4;
    }

    .btn-play {
      padding: 16px 40px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border: none;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-bottom: 0.75rem;
    }

    .btn-play:active {
      transform: scale(0.95);
      box-shadow: 0 5px 12px rgba(59, 130, 246, 0.4);
    }

    .btn-home {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: 30px;
      color: #cbd5e1;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* Mobile Controls Hint */
    .controls-hint {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      padding: 8px 16px;
      border-radius: 30px;
      color: #cbd5e1;
      font-size: 0.8rem;
      pointer-events: none;
      z-index: 5;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <div class="hud-box">
        <div class="score-title">SCORE</div>
        <div id="scoreVal">0</div>
      </div>
      <div class="hud-box">
        <div class="score-title" style="margin-bottom: 4px;">ARMOR</div>
        <div class="lives-container" id="livesBox">
          <svg class="life-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          <svg class="life-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          <svg class="life-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
      </div>
    </div>

    <div class="hud-right">
      <!-- Pause Icon Button -->
      <div class="hud-box hud-btn" id="pauseBtn" title="Pause Game">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
          <rect x="5" y="3" width="4" height="18" rx="1"/>
          <rect x="15" y="3" width="4" height="18" rx="1"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="controls-hint" id="hint">Touch & drag to steer • Hold screen to shoot • Tap ⏸ to pause</div>

  <!-- Start Overlay -->
  <div class="overlay" id="startOverlay">
    <h1 class="title">SKY INVADERS</h1>
    <p class="subtitle">Touch & hold to steer your airplane and blast UFO sorties in formation!</p>
    <button class="btn-play" id="startBtn">START FLIGHT</button>
    <a href="index.html" class="btn-home">Back to Launcher</a>
  </div>

  <!-- Pause Overlay -->
  <div class="overlay hidden" id="pauseOverlay">
    <h1 class="title" style="background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text;">GAME PAUSED</h1>
    <p class="subtitle">Take a breather pilot!</p>
    <button class="btn-play" id="resumeBtn">RESUME FLIGHT</button>
    <button class="btn-play" id="pauseRestartBtn" style="background: linear-gradient(135deg, #475569, #334155); font-size: 1rem; padding: 12px 30px;">Restart</button>
    <a href="index.html" class="btn-home" style="margin-top: 0.5rem;">Back to Launcher</a>
  </div>

  <!-- Game Over Overlay -->
  <div class="overlay hidden" id="gameOverOverlay">
    <h1 class="title" style="background: linear-gradient(135deg, #ef4444, #f97316); -webkit-background-clip: text;">GAME OVER</h1>
    <p class="subtitle" id="finalScoreText">Final Score: 0</p>
    <button class="btn-play" id="restartBtn">FLY AGAIN</button>
    <a href="index.html" class="btn-home">Back to Launcher</a>
  </div>

  <script>
    // --- Web Audio Synthesizer (Half Volume) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
        gain.gain.setValueAtTime(0.075, now); // Reduced by half
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'explosion') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
        gain.gain.setValueAtTime(0.15, now); // Reduced by half
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.10, now); // Reduced by half
        gain.gain.linearRampToValueAtTime(0.005, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    // --- Game Setup & State ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, dpr;
    function resize() {
      dpr = window.devicePixelRatio || 1;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'START'; // START, PLAYING, PAUSED, GAMEOVER
    let score = 0;
    let lives = 3;
    let frameCount = 0;

    // Player Airplane
    const player = {
      x: width / 2,
      y: height - 120,
      targetX: width / 2,
      targetY: height - 120,
      width: 44,
      height: 48,
      speed: 0.35, // Faster, responsive tracking
      tilt: 0
    };

    // Arrays
    let bullets = [];
    let enemies = [];
    let particles = [];
    let clouds = [];
    let stars = [];

    // Forward Scrolling Background (Stars & Clouds)
    for (let i = 0; i < 45; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2 + 0.5,
        speed: Math.random() * 3 + 2,
        opacity: Math.random() * 0.8 + 0.2
      });
    }

    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 40 + 40,
        speed: Math.random() * 1.5 + 1,
        opacity: Math.random() * 0.12 + 0.05
      });
    }

    // Touch & Pointer Input Handlers
    let isTouching = false;

    function handlePointerStart(clientX, clientY, isNav = false) {
      if (isNav || state !== 'PLAYING') return;
      initAudio();
      isTouching = true;
      player.targetX = clientX;
      player.targetY = clientY - 40;
    }

    function handlePointerMove(clientX, clientY) {
      if (!isTouching || state !== 'PLAYING') return;
      player.targetX = clientX;
      player.targetY = clientY - 40;
    }

    function handlePointerEnd() {
      isTouching = false;
    }

    // Stop HUD touches from triggering flight target move
    document.querySelector('.hud').addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    document.querySelector('.hud').addEventListener('mousedown', (e) => e.stopPropagation());

    window.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      handlePointerStart(touch.clientX, touch.clientY);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      handlePointerMove(touch.clientX, touch.clientY);
    }, { passive: true });

    window.addEventListener('touchend', handlePointerEnd);
    window.addEventListener('touchcancel', handlePointerEnd);

    window.addEventListener('mousedown', (e) => handlePointerStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handlePointerEnd);

    // Keyboard support
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    // --- UFO Sortie / Squadron Spawner (Smaller UFOs attacking in groups) ---
    function spawnSortie() {
      const formations = ['V_FORMATION', 'LINE_ROW', 'DIAGONAL_STREAK', 'CLUSTER'];
      const formation = formations[Math.floor(Math.random() * formations.length)];
      
      const types = ['ufo_small', 'ufo_medium', 'ufo_fast'];
      const type = types[Math.floor(Math.random() * types.length)];
      
      // Smaller radii for smaller targets
      let radius = 11;
      let speed = 2.4;
      let hp = 1;

      if (type === 'ufo_medium') {
        radius = 15;
        speed = 1.8;
        hp = 2;
      } else if (type === 'ufo_fast') {
        radius = 9;
        speed = 3.6;
        hp = 1;
      }

      const startX = Math.random() * (width - 160) + 80;
      const startY = -60;

      if (formation === 'V_FORMATION') {
        const offsets = [
          { x: 0, y: 0 },
          { x: -30, y: -30 },
          { x: 30, y: -30 },
          { x: -60, y: -60 },
          { x: 60, y: -60 }
        ];
        offsets.forEach(off => {
          enemies.push({
            x: Math.max(20, Math.min(width - 20, startX + off.x)),
            y: startY + off.y,
            radius: radius,
            speed: speed + (score / 250),
            hp: hp,
            maxHp: hp,
            type: type,
            wigglePhase: Math.random() * Math.PI * 2,
            wiggleAmp: 0.8
          });
        });
      } else if (formation === 'LINE_ROW') {
        const count = 4;
        const spacing = 42;
        const leftX = Math.max(25, Math.min(width - (count * spacing), startX - (count * spacing) / 2));
        for (let i = 0; i < count; i++) {
          enemies.push({
            x: leftX + i * spacing,
            y: startY,
            radius: radius,
            speed: speed + (score / 250),
            hp: hp,
            maxHp: hp,
            type: type,
            wigglePhase: Math.random() * Math.PI * 2,
            wiggleAmp: 0.5
          });
        }
      } else if (formation === 'DIAGONAL_STREAK') {
        const count = 4;
        const dir = Math.random() > 0.5 ? 1 : -1;
        for (let i = 0; i < count; i++) {
          enemies.push({
            x: Math.max(20, Math.min(width - 20, startX + i * 32 * dir)),
            y: startY - i * 28,
            radius: radius,
            speed: speed + 0.4,
            hp: hp,
            maxHp: hp,
            type: type,
            wigglePhase: Math.random() * Math.PI * 2,
            wiggleAmp: 1
          });
        }
      } else { // CLUSTER
        const count = 3;
        for (let i = 0; i < count; i++) {
          enemies.push({
            x: Math.max(20, Math.min(width - 20, startX + (Math.random() - 0.5) * 50)),
            y: startY - i * 24,
            radius: radius,
            speed: speed,
            hp: hp,
            maxHp: hp,
            type: type,
            wigglePhase: Math.random() * Math.PI * 2,
            wiggleAmp: 1.2
          });
        }
      }
    }

    function createExplosion(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1.5,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function update() {
      // Background Forward Flight Animation continues even during pause/start
      stars.forEach(star => {
        star.y += (state === 'PAUSED' ? star.speed * 0.2 : star.speed);
        if (star.y > height) {
          star.y = 0;
          star.x = Math.random() * width;
        }
      });

      clouds.forEach(cloud => {
        cloud.y += (state === 'PAUSED' ? cloud.speed * 0.2 : cloud.speed);
        if (cloud.y - cloud.radius > height) {
          cloud.y = -cloud.radius;
          cloud.x = Math.random() * width;
        }
      });

      if (state !== 'PLAYING') return;

      frameCount++;

      // Keyboard Controls Update
      if (keys['ArrowLeft'] || keys['KeyA']) player.targetX -= 8;
      if (keys['ArrowRight'] || keys['KeyD']) player.targetX += 8;
      if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= 8;
      if (keys['ArrowDown'] || keys['KeyS']) player.targetY += 8;

      // Keep airplane inside screen bounds
      player.targetX = Math.max(25, Math.min(width - 25, player.targetX));
      player.targetY = Math.max(50, Math.min(height - 70, player.targetY));

      // Smooth Airplane Movement & Tilt
      const dx = player.targetX - player.x;
      player.x += dx * player.speed;
      player.y += (player.targetY - player.y) * player.speed;
      player.tilt = dx * 0.03;

      // SHOOT ONLY WHEN SCREEN IS BEING TOUCHED (OR SPACEBAR HELD) - Single Blaster (Slower Cadence)
      const isFiring = isTouching || keys['Space'] || keys['KeyZ'];
      if (isFiring && frameCount % 14 === 0) {
        bullets.push({
          x: player.x,
          y: player.y - 18,
          vy: -10,
          radius: 3.5
        });
        playSound('shoot');
      }

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.y < -20) {
          bullets.splice(i, 1);
        }
      }

      // Enemy Sortie Spawning Waves
      const sortieInterval = Math.max(100, 160 - Math.floor(score / 40));
      if (frameCount % sortieInterval === 0) {
        spawnSortie();
      }

      // Update Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.y += enemy.speed;
        enemy.x += Math.sin(frameCount * 0.05 + enemy.wigglePhase) * enemy.wiggleAmp;

        // Collision: Bullet <-> Enemy
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const dist = Math.hypot(b.x - enemy.x, b.y - enemy.y);
          if (dist < enemy.radius + b.radius) {
            bullets.splice(j, 1);
            enemy.hp--;
            createExplosion(b.x, b.y, '#38bdf8', 4);

            if (enemy.hp <= 0) {
              playSound('explosion');
              score += enemy.maxHp * 10;
              document.getElementById('scoreVal').innerText = score;
              createExplosion(enemy.x, enemy.y, '#a855f7', 14);
              createExplosion(enemy.x, enemy.y, '#38bdf8', 10);
              enemies.splice(i, 1);
              break;
            } else {
              playSound('hit');
            }
          }
        }

        // Collision: Enemy <-> Player Airplane
        const pDist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (pDist < enemy.radius + 16) {
          playSound('explosion');
          createExplosion(enemy.x, enemy.y, '#ef4444', 20);
          enemies.splice(i, 1);
          takeDamage();
        }

        // Off-screen enemy
        if (enemy.y > height + 50) {
          enemies.splice(i, 1);
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function takeDamage() {
      lives--;
      updateLivesUI();
      if (lives <= 0) {
        gameOver();
      }
    }

    function updateLivesUI() {
      const hearts = document.querySelectorAll('.life-heart');
      hearts.forEach((heart, idx) => {
        if (idx < lives) {
          heart.classList.remove('lost');
        } else {
          heart.classList.add('lost');
        }
      });
    }

    // --- Rendering ---
    function draw() {
      ctx.clearRect(0, 0, width, height);

      // 1. Starfield
      stars.forEach(star => {
        ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // 2. Clouds
      clouds.forEach(cloud => {
        ctx.fillStyle = `rgba(255, 255, 255, ${cloud.opacity})`;
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.radius, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.radius * 0.5, cloud.y - cloud.radius * 0.2, cloud.radius * 0.7, 0, Math.PI * 2);
        ctx.arc(cloud.x - cloud.radius * 0.5, cloud.y - cloud.radius * 0.2, cloud.radius * 0.7, 0, Math.PI * 2);
        ctx.fill();
      });

      // 3. Bullets
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 8;
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // 4. Smaller Alien UFO Enemies (Group Sorties)
      enemies.forEach(enemy => {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);

        ctx.shadowColor = enemy.type === 'ufo_fast' ? '#ef4444' : '#a855f7';
        ctx.shadowBlur = 10;

        // UFO Saucer Base
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.ellipse(0, 3, enemy.radius, enemy.radius * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();

        // Glowing Glass Dome
        ctx.fillStyle = enemy.type === 'ufo_fast' ? '#f87171' : '#c084fc';
        ctx.beginPath();
        ctx.arc(0, -1, enemy.radius * 0.55, Math.PI, 0);
        ctx.fill();

        // Saucer Lights
        ctx.fillStyle = '#fef08a';
        for (let l = -2; l <= 2; l++) {
          ctx.beginPath();
          ctx.arc(l * (enemy.radius * 0.35), 3, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      });

      // 5. Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 6. Player Airplane
      if (state === 'PLAYING' || state === 'PAUSED' || state === 'START') {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.tilt);

        // Thruster Flame
        const flameLength = Math.random() * 12 + 14;
        const gradient = ctx.createLinearGradient(0, 18, 0, 18 + flameLength);
        gradient.addColorStop(0, '#f97316');
        gradient.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(-5, 18);
        ctx.lineTo(5, 18);
        ctx.lineTo(0, 18 + flameLength);
        ctx.closePath();
        ctx.fill();

        // Main Wings
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(24, 10);
        ctx.lineTo(10, 14);
        ctx.lineTo(0, 8);
        ctx.lineTo(-10, 14);
        ctx.lineTo(-24, 10);
        ctx.closePath();
        ctx.fill();

        // Airplane Fuselage
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.ellipse(0, 0, 6.5, 22, 0, 0, Math.PI * 2);
        ctx.fill();

        // Tail Wings
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.moveTo(0, 12);
        ctx.lineTo(10, 20);
        ctx.lineTo(-10, 20);
        ctx.closePath();
        ctx.fill();

        // Cockpit Canopy Glass
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.ellipse(0, -5, 3.5, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // --- Main Game Loop ---
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // --- Game Mode Transitions ---
    function startGame() {
      initAudio();
      state = 'PLAYING';
      score = 0;
      lives = 3;
      bullets = [];
      enemies = [];
      particles = [];
      document.getElementById('scoreVal').innerText = '0';
      updateLivesUI();
      document.getElementById('startOverlay').classList.add('hidden');
      document.getElementById('pauseOverlay').classList.add('hidden');
      document.getElementById('gameOverOverlay').classList.add('hidden');
      
      const hint = document.getElementById('hint');
      hint.style.display = 'block';
      setTimeout(() => { hint.style.display = 'none'; }, 4000);
    }

    function togglePause() {
      if (state === 'PLAYING') {
        state = 'PAUSED';
        document.getElementById('pauseOverlay').classList.remove('hidden');
      } else if (state === 'PAUSED') {
        state = 'PLAYING';
        document.getElementById('pauseOverlay').classList.add('hidden');
      }
    }

    function gameOver() {
      state = 'GAMEOVER';
      document.getElementById('finalScoreText').innerText = `Final Score: ${score}`;
      document.getElementById('gameOverOverlay').classList.remove('hidden');
    }

    // Event Listeners
    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('pauseRestartBtn').addEventListener('click', startGame);
    document.getElementById('resumeBtn').addEventListener('click', togglePause);
    document.getElementById('pauseBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      togglePause();
    });
  </script>
</body>
</html>
