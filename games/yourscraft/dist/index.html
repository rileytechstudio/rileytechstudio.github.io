#minecraft-hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
    font-family: 'Minecraft', monospace, sans-serif;
    font-size: 12px;
    image-rendering: pixelated;
    z-index: 100;
}

#hud-crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 16px;
    transform: translate(-50%, -50%);
    background: url('${ke.crosshair}') no-repeat center;
    mix-blend-mode: difference;
}

#hud-bottom-bar {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

#hud-status-bars {
    display: flex;
    justify-content: space-between;
    width: 364px;
    margin-bottom: 2px;
}

.hud-stat-row {
    display: flex;
    gap: 1px;
}

.hud-icon {
    width: 18px;
    height: 18px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

#hud-exp-container {
    position: relative;
    width: 364px;
    height: 8px;
    background: #000000;
    border: 1px solid #1a1a1a;
    border-radius: 1px;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.8);
}

#hud-exp-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(to bottom, #8bf332, #55aa16);
    transition: width 0.15s ease;
}

#hud-exp-level {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    color: #80ff20;
    font-weight: bold;
    font-size: 14px;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
}

#hud-hotbar-frame {
    display: flex;
    background: rgba(0, 0, 0, 0.45);
    border: 2px solid #3c3c3c;
    border-top-color: #8b8b8b;
    border-left-color: #8b8b8b;
    border-radius: 2px;
    padding: 2px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
}

.hud-slot {
    position: relative;
    width: 38px;
    height: 38px;
    background: #8b8b8b;
    border: 2px solid #373737;
    border-top-color: #373737;
    border-left-color: #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    margin: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

.hud-slot.selected {
    outline: 2px solid #ffffff;
    border-color: #ffffff;
    z-index: 2;
    transform: scale(1.05);
}

.hud-slot-img {
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
    pointer-events: none;
}

.hud-slot-count {
    position: absolute;
    bottom: 1px;
    right: 2px;
    color: #ffffff;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
    pointer-events: none;
}

.hud-slot-durability {
    position: absolute;
    bottom: 2px;
    left: 4px;
    width: 30px;
    height: 2px;
    background: #000;
}

.hud-slot-durability-fill {
    height: 100%;
    background: #00ff00;
}

#hud-item-tooltip {
    position: absolute;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(16, 0, 16, 0.85);
    border: 2px solid #280050;
    color: #ffffff;
    padding: 4px 8px;
    font-size: 13px;
    border-radius: 2px;
    text-shadow: 1px 1px 0 #3f3f3f;
    opacity: 0;
    transition: opacity 0.25s ease-out;
    pointer-events: none;
    white-space: nowrap;
}

#hud-scoreboard-sidebar {
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    min-width: 140px;
    max-width: 280px;
    background: rgba(0, 0, 0, 0.4);
    color: #ffffff;
    font-family: 'Minecraft', monospace, sans-serif;
    font-size: 13px;
    line-height: 1.35;
    user-select: none;
    pointer-events: none;
    display: none;
    flex-direction: column;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    border-radius: 1px;
}

.hud-scoreboard-title {
    background: rgba(0, 0, 0, 0.45);
    color: #ffff55;
    font-weight: bold;
    text-align: center;
    padding: 4px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    text-shadow: 1px 1px 0 #3f3f00, 1px 1px 2px rgba(0, 0, 0, 0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.hud-scoreboard-list {
    display: flex;
    flex-direction: column;
    padding: 2px 0;
}

.hud-scoreboard-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 8px;
    gap: 14px;
    white-space: nowrap;
}

.hud-scoreboard-name {
    color: #ffffff;
    text-shadow: 1px 1px 0 #000000;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
}

.hud-scoreboard-score {
    color: #ff5555;
    font-weight: bold;
    text-shadow: 1px 1px 0 #3f0000;
    margin-left: auto;
    text-align: right;
}

@keyframes hud-heart-damage {
    0% { transform: translateY(0); }
    25% { transform: translateY(-3px); }
    50% { transform: translateY(2px); }
    75% { transform: translateY(-1px); }
    100% { transform: translateY(0); }
}

.hud-shake {
    animation: hud-heart-damage 0.2s ease;
}

#minecraft-inventory-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    user-select: none;
    font-family: 'Minecraft', monospace, sans-serif;
    image-rendering: pixelated;
    z-index: 500;

#inv-panel {
    background: #c6c6c6;
    border: 4px solid #ffffff;
    border-right-color: #555555;
    border-bottom-color: #555555;

}

.inv-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #3f3f3f;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 2px;
}

    cursor: pointer;
    padding: 2px 6px;
    font-weight: bold;
}

.inv-close-btn:hover {
    background: #ff5555;
    color: #fff;
}

.inv-top-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #b5b5b5;
    padding: 8px 12px;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    gap: 16px;
}

.inv-player-box {
    display: flex;
    gap: 8px;
    align-items: center;
}

.inv-armor-column {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.inv-character-preview {
    width: 52px;
    height: 78px;
    background: #8b8b8b;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.inv-character-silhouette {
    width: 36px;
    height: 60px;
    background: #555555;
    border-radius: 2px;
    opacity: 0.6;
}

.inv-crafting-area {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.inv-crafting-label {
    color: #3f3f3f;
    font-size: 12px;
    font-weight: bold;
}

.inv-crafting-row {
    display: flex;
    align-items: center;
    gap: 14px;
}

.inv-grid-2x2 {
    display: grid;
    grid-template-columns: repeat(2, 38px);
    gap: 2px;
}

.inv-grid-3x3 {
    display: grid;
    grid-template-columns: repeat(3, 38px);
    gap: 2px;
}

.inv-craft-arrow {
    font-size: 24px;
    color: #4a4a4a;
    font-weight: bold;
    user-select: none;
}

.inv-section-label {
    color: #3f3f3f;
    font-size: 12px;
    font-weight: bold;
    margin-top: 2px;
    margin-bottom: -4px;
}

.inv-slots-grid-9x3 {
    display: grid;
    grid-template-columns: repeat(9, 38px);
    gap: 2px;
}

.inv-hotbar-grid {
    display: grid;
    grid-template-columns: repeat(9, 38px);
    gap: 2px;
    margin-top: 2px;
}

.inv-slot {
    position: relative;
    width: 38px;
    height: 38px;
    background: #8b8b8b;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-sizing: border-box;
    transition: background 0.05s ease;
}

.inv-slot:hover, .inv-slot.drag-over {
    background: #a0a0a0;
    outline: 1px solid #ffffff;
}

.inv-slot.craft-output {
    width: 44px;
    height: 44px;
    background: #999999;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
}

.inv-slot.craft-output:hover {
    background: #afafaf;
    outline: 2px solid #ffffff;
}

.inv-slot-img {
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
    pointer-events: none;
    user-select: none;
}

.inv-slot-count {
    position: absolute;
    bottom: 1px;
    right: 2px;
    color: #ffffff;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
    pointer-events: none;
    user-select: none;
}

#inv-cursor-item {
    position: fixed;
    pointer-events: none;
    z-index: 1000;
    display: none;
    transform: translate(-50%, -50%);
}

#inv-cursor-img {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
}

#inv-cursor-count {
    position: absolute;
    bottom: -2px;
    right: -2px;
    color: #ffffff;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
}

#inv-tooltip {
    position: fixed;
    background: rgba(16, 0, 16, 0.95);
    border: 2px solid #37007a;
    color: #ffffff;
    padding: 6px 10px;
    font-size: 14px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 1001;
    display: none;
    white-space: nowrap;
    text-shadow: 1px 1px 0 #000;
}

#minecraft-anvil-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    user-select: none;
    font-family: 'Minecraft', monospace, sans-serif;
    image-rendering: pixelated;
    z-index: 550;
}

#anvil-panel {
    background: #c6c6c6;
    border: 4px solid #ffffff;
    border-right-color: #555555;
    border-bottom-color: #555555;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 2px 2px 0 #dbdbdb, inset -2px -2px 0 #8b8b8b;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 380px;
}

.anvil-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #3f3f3f;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 2px;
}

.anvil-close-btn {
    background: #dbdbdb;
    border: 2px solid #ffffff;
    border-right-color: #555555;
    border-bottom-color: #555555;
    color: #222;
    cursor: pointer;
    padding: 2px 8px;
    font-weight: bold;
    font-size: 12px;
}

.anvil-close-btn:hover {
    background: #ff5555;
    color: #fff;
}

.anvil-rename-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #b0b0b0;
    padding: 8px 10px;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
}

.anvil-rename-label {
    color: #3f3f3f;
    font-size: 11px;
    font-weight: bold;
}

.anvil-input-wrapper {
    display: flex;
    position: relative;
    background: #373737;
    border: 2px solid #222222;
    border-right-color: #555555;
    border-bottom-color: #555555;
}

.anvil-rename-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-family: 'Minecraft', monospace, sans-serif;
    font-size: 14px;
    padding: 5px 8px;
    box-sizing: border-box;
}

.anvil-rename-input:disabled {
    color: #888888;
    cursor: not-allowed;
}

.anvil-slots-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #b5b5b5;
    padding: 12px 14px;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
}

.anvil-inputs-group {
    display: flex;
    align-items: center;
    gap: 12px;
}

.anvil-plus-sign {
    color: #4a4a4a;
    font-size: 20px;
    font-weight: bold;
    user-select: none;
}

.anvil-arrow-sign {
    color: #4a4a4a;
    font-size: 24px;
    font-weight: bold;
    user-select: none;
}

.anvil-slot {
    position: relative;
    width: 38px;
    height: 38px;
    background: #8b8b8b;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-sizing: border-box;
}

.anvil-slot:hover {
    background: #a0a0a0;
    outline: 1px solid #ffffff;
}

.anvil-slot.output-slot {
    width: 46px;
    height: 46px;
    background: #969696;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
}

.anvil-slot.output-slot:hover {
    background: #b0b0b0;
    outline: 2px solid #ffff55;
}

.anvil-slot-img {
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
    pointer-events: none;
    user-select: none;
}

.anvil-slot.output-slot .anvil-slot-img {
    width: 32px;
    height: 32px;
}

.anvil-slot-count {
    position: absolute;
    bottom: 1px;
    right: 2px;
    color: #ffffff;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
    pointer-events: none;
    user-select: none;
}

.anvil-cost-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px;
    min-height: 22px;
}

.anvil-cost-text {
    font-size: 13px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
}

.anvil-cost-green {
    color: #55ff55;
}

.anvil-cost-red {
    color: #ff5555;
}

.anvil-player-xp {
    color: #55ff55;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
    display: flex;
    align-items: center;
    gap: 4px;
}

.anvil-section-label {
    color: #3f3f3f;
    font-size: 12px;
    font-weight: bold;
    margin-top: 2px;
    margin-bottom: -4px;
}

.anvil-inv-grid {
    display: grid;
    grid-template-columns: repeat(9, 38px);
    gap: 2px;
}

.anvil-hotbar-grid {
    display: grid;
    grid-template-columns: repeat(9, 38px);
    gap: 2px;
    margin-top: 2px;
}

#anvil-cursor-item {
    position: fixed;
    pointer-events: none;
    z-index: 1200;
    display: none;
    transform: translate(-50%, -50%);
}

#anvil-cursor-img {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
}

#anvil-cursor-count {
    position: absolute;
    bottom: -2px;
    right: -2px;
    color: #ffffff;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
}

.anvil-enchant-glint {
    filter: drop-shadow(0 0 4px #b855ff);
}

#minecraft-enchanting-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    user-select: none;
    font-family: 'Minecraft', monospace, sans-serif;
    image-rendering: pixelated;
    z-index: 550;
}

#enchanting-panel {
    background: #c6c6c6;
    border: 4px solid #ffffff;
    border-right-color: #555555;
    border-bottom-color: #555555;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 2px 2px 0 #dbdbdb, inset -2px -2px 0 #8b8b8b;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 400px;
}

.enchant-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #3f3f3f;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 2px;
}

.enchant-close-btn {
    background: #dbdbdb;
    border: 2px solid #ffffff;
    border-right-color: #555555;
    border-bottom-color: #555555;
    color: #222;
    cursor: pointer;
    padding: 2px 8px;
    font-weight: bold;
    font-size: 12px;
}

.enchant-close-btn:hover {
    background: #ff5555;
    color: #fff;
}

.enchant-top-area {
    display: flex;
    background: #b5b5b5;
    padding: 12px;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    gap: 14px;
    align-items: center;
}

.enchant-book-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 70px;
}

.enchant-book-icon {
    width: 48px;
    height: 48px;
    background: #4a2869;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    border-radius: 4px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

.enchant-slots-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.enchant-slot {
    position: relative;
    width: 40px;
    height: 40px;
    background: #8b8b8b;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-sizing: border-box;
}

.enchant-slot:hover {
    background: #a0a0a0;
    outline: 1px solid #ffffff;
}

.enchant-slot-img {
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
    pointer-events: none;
    user-select: none;
}

.enchant-slot-count {
    position: absolute;
    bottom: 1px;
    right: 2px;
    color: #ffffff;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
    pointer-events: none;
}

.enchant-offers-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    flex: 1;
}

.enchant-offer-btn {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #735987;
    border: 2px solid #ffffff;
    border-right-color: #372545;
    border-bottom-color: #372545;
    padding: 6px 10px;
    cursor: pointer;
    transition: background 0.1s ease;
    min-height: 32px;
    box-sizing: border-box;
}

.enchant-offer-btn:hover:not(.disabled) {
    background: #8e6fa6;
    outline: 1px solid #ffffff;
}

.enchant-offer-btn.disabled {
    background: #473e4f;
    border-color: #635b6b;
    border-right-color: #2b2530;
    border-bottom-color: #2b2530;
    opacity: 0.7;
    cursor: not-allowed;
}

.enchant-offer-runes {
    color: #ffd700;
    font-size: 12px;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 #332200;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    max-width: 170px;
}

.enchant-offer-btn.disabled .enchant-offer-runes {
    color: #8c8294;
}

.enchant-offer-level {
    color: #55ff55;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #003300;
    background: rgba(0, 0, 0, 0.4);
    padding: 2px 6px;
    border-radius: 2px;
}

.enchant-offer-btn.disabled .enchant-offer-level {
    color: #ff5555;
    text-shadow: 1px 1px 0 #330000;
}

.enchant-offer-hint {
    position: absolute;
    bottom: -24px;
    left: 10px;
    background: rgba(16, 12, 28, 0.95);
    color: #ffaa00;
    border: 1px solid #7744aa;
    padding: 2px 6px;
    font-size: 11px;
    white-space: nowrap;
    z-index: 100;
    display: none;
    pointer-events: none;
    box-shadow: 0 4px 8px rgba(0,0,0,0.6);
}

.enchant-offer-btn:hover .enchant-offer-hint {
    display: block;
}

.enchant-xp-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px;
    color: #55ff55;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
}

.enchant-section-label {
    color: #3f3f3f;
    font-size: 12px;
    font-weight: bold;
    margin-top: 2px;
    margin-bottom: -4px;
}

.enchant-inv-grid {
    display: grid;
    grid-template-columns: repeat(9, 38px);
    gap: 2px;
}

.enchant-hotbar-grid {
    display: grid;
    grid-template-columns: repeat(9, 38px);
    gap: 2px;
    margin-top: 2px;
}

#enchant-cursor-item {
    position: fixed;
    pointer-events: none;
    z-index: 1200;
    display: none;
    transform: translate(-50%, -50%);
}

#enchant-cursor-img {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
}

#enchant-cursor-count {
    position: absolute;
    bottom: -2px;
    right: -2px;
    color: #ffffff;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
}

.enchant-glow {

}

#minecraft-furnace-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    user-select: none;
    font-family: 'Minecraft', monospace, sans-serif;
    image-rendering: pixelated;
    z-index: 550;
}

#furnace-panel {
    background: #c6c6c6;
    border: 4px solid #ffffff;
    border-right-color: #555555;
    border-bottom-color: #555555;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 2px 2px 0 #dbdbdb, inset -2px -2px 0 #8b8b8b;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 380px;
}

.furnace-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #3f3f3f;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 2px;
}

.furnace-close-btn {
    background: #dbdbdb;
    border: 2px solid #ffffff;
    border-right-color: #555555;
    border-bottom-color: #555555;
    color: #222;
    cursor: pointer;
    padding: 2px 8px;
    font-weight: bold;
    font-size: 12px;
}

.furnace-close-btn:hover {
    background: #ff5555;
    color: #fff;
}

.furnace-work-area {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: #b5b5b5;
    padding: 16px 20px;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    min-height: 120px;
}

.furnace-left-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.furnace-flame-container {
    position: relative;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.furnace-flame-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 28px;
    height: 28px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

.furnace-flame-lit {
    position: absolute;
    top: 0;
    left: 0;
    width: 28px;
    height: 28px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    transition: clip-path 0.05s linear;
}

.furnace-flame-burning {
    animation: furnace-fire-flicker 0.35s infinite alternate ease-in-out;
}

@keyframes furnace-fire-flicker {
    0% {
        filter: drop-shadow(0 0 3px #ff7700) brightness(1.0);
    }
    100% {
        filter: drop-shadow(0 0 7px #ff3300) brightness(1.2);
    }
}

.furnace-center-col {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 14px;
}

.furnace-arrow-container {
    position: relative;
    width: 36px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.furnace-arrow-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 36px;
    height: 26px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

.furnace-arrow-progress {
    position: absolute;
    top: 0;
    left: 0;
    width: 36px;
    height: 26px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    transition: clip-path 0.05s linear;
}

.furnace-right-col {
    display: flex;
    align-items: center;
    justify-content: center;
}

.furnace-slot {
    position: relative;
    width: 38px;
    height: 38px;
    background: #8b8b8b;
    border: 2px solid #373737;
    border-bottom-color: #ffffff;
    border-right-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-sizing: border-box;
}

.furnace-slot:hover {
    background: #a0a0a0;
    outline: 1px solid #ffffff;
}

.furnace-slot.output-slot {
    width: 50px;
    height: 50px;
    background: #969696;
}

.furnace-slot.output-slot:hover {
    background: #b0b0b0;
    outline: 2px solid #ffff55;
}

.furnace-slot-img {
    width: 28px;
    height: 28px;
    image-rendering: pixelated;
    pointer-events: none;
    user-select: none;
}

.furnace-slot.output-slot .furnace-slot-img {
    width: 36px;
    height: 36px;
}

.furnace-slot-count {
    position: absolute;
    bottom: 1px;
    right: 2px;
    color: #ffffff;
    font-size: 11px;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000000;
    pointer-events: none;
    user-select: none;
}

.furnace-section-label {

    font-size: 12px;
    font-weight: bold;
    margin-top: 2px;
    margin-bottom: -4px;

.furnace-inv-grid {

    grid-template-columns: repeat(9, 38px);

}

}

}

#furnace-cursor-count {
