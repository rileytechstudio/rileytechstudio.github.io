        let shedCount = 1;

        function placeCoveredBridgeShed(centerX, centerZ) {
            const info = getShedOrientationAndValidity(centerX, centerZ);
            if (!info.isValid) return false;

            const isVertical = info.isVertical;

            const shedTiles = isVertical ? [
                {x: centerX, z: centerZ - 1},
                {x: centerX, z: centerZ},
                {x: centerX, z: centerZ + 1}
            ] : [
                {x: centerX - 1, z: centerZ},
                {x: centerX, z: centerZ},
                {x: centerX + 1, z: centerZ}
            ];

            const leadTiles = isVertical ? [
                {x: centerX, z: centerZ - 2},
                {x: centerX, z: centerZ + 2}
            ] : [
                {x: centerX - 2, z: centerZ},
                {x: centerX + 2, z: centerZ}
            ];

            [...shedTiles, ...leadTiles].forEach(t => {
                const k = getKey(t.x, t.z);
                if (worldObjects.has(k)) {
                    const obj = worldObjects.get(k);
                    if (obj.type === 'tree') {
                        scene.remove(obj.group);
                        disposeObject(obj.group);
                        worldObjects.delete(k);
                    } else if (obj.type === 'track' && shedTiles.some(st => st.x === t.x && st.z === t.z)) {
                        scene.remove(obj.group);
                        disposeObject(obj.group);
                        worldObjects.delete(k);
                    }
                }
            });

            const bridgeMesh = createCoveredBridgeMesh();
            bridgeMesh.position.set(centerX, 0, centerZ);
            if (isVertical) {
                bridgeMesh.rotation.y = Math.PI / 2;
            }
            scene.add(bridgeMesh);

            const bridgeData = {
                type: 'bridge',
                centerX,
                centerZ,
                isVertical,
                group: bridgeMesh,
                trainSpawned: false
            };

            shedTiles.forEach(t => {
                const k = getKey(t.x, t.z);
                const conn = isVertical ? new Set(['N', 'S']) : new Set(['E', 'W']);
                worldObjects.set(k, {
                    type: 'bridge_track',
                    x: t.x,
                    z: t.z,
                    connections: conn,
                    bridgeRef: bridgeData
                });
            });

            bridges.push(bridgeData);

            const primaryDirs = isVertical ? ['N', 'S'] : ['E', 'W'];
            leadTiles.forEach(lt => {
                const key = getKey(lt.x, lt.z);
                let existing = worldObjects.get(key);

                let connections = new Set(primaryDirs);
                if (existing && existing.type === 'track') {
                    existing.connections.forEach(c => connections.add(c));
                }

                for (let dKey of ['N', 'E', 'S', 'W']) {
                    const d = DIRS[dKey];
                    const nKey = getKey(lt.x + d.dx, lt.z + d.dz);
                    const neighbor = worldObjects.get(nKey);

                    if (neighbor && neighbor.type === 'track' && neighbor.connections.size < 3) {
                        connections.add(dKey);
                        neighbor.connections.add(d.opp);
                        setTrack(neighbor.x, neighbor.z, neighbor.connections, neighbor.switchIndex);
                    }
                }

                setTrack(lt.x, lt.z, connections, 0);
            });

            checkBridgeTrainSpawns();
            return true;
        }

        function countContinuousTracks(startX, startZ, stepDir) {
            let count = 0;
            let currX = startX;
            let currZ = startZ;
            const d = DIRS[stepDir];

            while (true) {
                currX += d.dx;
                currZ += d.dz;
                const k = getKey(currX, currZ);
                const obj = worldObjects.get(k);
                if (obj && obj.type === 'track') {
                    count++;
                } else {
                    break;
                }
            }
            return count;
        }

        function checkBridgeTrainSpawns() {
            bridges.forEach(bridge => {
                if (bridge.trainSpawned) return;

                if (bridge.isVertical) {
                    const northTrackCount = countContinuousTracks(bridge.centerX, bridge.centerZ - 1, 'N');
                    const southTrackCount = countContinuousTracks(bridge.centerX, bridge.centerZ + 1, 'S');

                    if (northTrackCount >= 3) {
                        spawnTrain(bridge.centerX, bridge.centerZ - 1, 'S', 'N');
                        bridge.trainSpawned = true;
                    } else if (southTrackCount >= 3) {
                        spawnTrain(bridge.centerX, bridge.centerZ + 1, 'N', 'S');
                        bridge.trainSpawned = true;
                    }
                } else {
                    const westTrackCount = countContinuousTracks(bridge.centerX - 1, bridge.centerZ, 'W');
                    const eastTrackCount = countContinuousTracks(bridge.centerX + 1, bridge.centerZ, 'E');

                    if (westTrackCount >= 3) {
                        spawnTrain(bridge.centerX - 1, bridge.centerZ, 'E', 'W');
                        bridge.trainSpawned = true;
                    } else if (eastTrackCount >= 3) {
                        spawnTrain(bridge.centerX + 1, bridge.centerZ, 'W', 'E');
                        bridge.trainSpawned = true;
                    }
                }
            });
        }

        // 8. Station & Passenger Logic
        let score = 0;
        let grantedThirdStationShed = false;
        let grantedFifthStationShed = false;

        function layStationPlatformTracks(station) {
            const isVerticalAxis = (station.rotIndex === 0 || station.rotIndex === 2);
            const primaryDirs = isVerticalAxis ? ['N', 'S'] : ['E', 'W'];

            for (let tile of station.openSideTiles) {
                const key = getKey(tile.x, tile.z);
                const existing = worldObjects.get(key);
                if (existing && existing.type === 'tree') {
                    scene.remove(existing.group);
                    disposeObject(existing.group);
                    worldObjects.delete(key);
                }
            }

            for (let tile of station.openSideTiles) {
                const key = getKey(tile.x, tile.z);
                let existing = worldObjects.get(key);

                let connections = new Set(primaryDirs);
                if (existing && existing.type === 'track') {
                    existing.connections.forEach(c => connections.add(c));
                }

                for (let dKey of ['N', 'E', 'S', 'W']) {
                    const d = DIRS[dKey];
                    const nKey = getKey(tile.x + d.dx, tile.z + d.dz);
                    const neighbor = worldObjects.get(nKey);

                    if (neighbor && neighbor.type === 'track' && neighbor.connections.size < 3) {
                        connections.add(dKey);
                        neighbor.connections.add(d.opp);
                        setTrack(neighbor.x, neighbor.z, neighbor.connections, neighbor.switchIndex);
                    }
                }

                setTrack(tile.x, tile.z, connections, 0);
            }
        }

        function spawnRandomStation() {
            if (stations.length >= 6) return;

            let placed = false;
            let attempts = 0;
            while (!placed && attempts < 150) {
                attempts++;
                const rx = Math.floor(Math.random() * (MAP_BOUNDS.maxX - MAP_BOUNDS.minX - 4)) + MAP_BOUNDS.minX + 2;
                const rz = Math.floor(Math.random() * (MAP_BOUNDS.maxZ - MAP_BOUNDS.minZ - 4)) + MAP_BOUNDS.minZ + 2;

                const isTall = Math.random() < 0.5;
                let rotIndex;

                if (isTall) {
                    if (rx > 0) rotIndex = 0;
                    else if (rx < 0) rotIndex = 2;
                    else rotIndex = Math.random() < 0.5 ? 0 : 2;
                } else {
                    if (rz > 0) rotIndex = 3;
                    else if (rz < 0) rotIndex = 1;
                    else rotIndex = Math.random() < 0.5 ? 1 : 3;
                }

                let footprint = [];
                let openSideTiles = [];

                if (rotIndex === 0) {
                    footprint = [{x: rx, z: rz}, {x: rx, z: rz + 1}];
                    openSideTiles = [{x: rx - 1, z: rz}, {x: rx - 1, z: rz + 1}];
                } else if (rotIndex === 1) {
                    footprint = [{x: rx, z: rz}, {x: rx + 1, z: rz}];
                    openSideTiles = [{x: rx, z: rz + 1}, {x: rx + 1, z: rz + 1}];
                } else if (rotIndex === 2) {
                    footprint = [{x: rx, z: rz}, {x: rx, z: rz - 1}];
                    openSideTiles = [{x: rx + 1, z: rz}, {x: rx + 1, z: rz - 1}];
                } else if (rotIndex === 3) {
                    footprint = [{x: rx, z: rz}, {x: rx - 1, z: rz}];
                    openSideTiles = [{x: rx, z: rz - 1}, {x: rx - 1, z: rz - 1}];
                }

                let tooClose = false;
                for (let s of stations) {
                    const distSq = (rx - s.x) * (rx - s.x) + (rz - s.z) * (rz - s.z);
                    if (distSq < 64) {
                        tooClose = true;
                        break;
                    }
                }
                if (tooClose) continue;

                let spaceBlocked = false;
                for (let fp of footprint.concat(openSideTiles)) {
                    const key = getKey(fp.x, fp.z);
                    const existing = worldObjects.get(key);
                    if (existing && (existing.type === 'station' || existing.type === 'border_tree' || existing.type === 'bridge' || existing.type === 'bridge_track')) {
                        spaceBlocked = true;
                        break;
                    }
                }
                if (spaceBlocked) continue;

                const colorObj = STATION_COLORS[stations.length];
                const stationGroup = createStation1x2Mesh(colorObj.hex);
                stationGroup.position.set(rx, 0, rz);
                stationGroup.rotation.y = rotIndex * (Math.PI / 2);
                scene.add(stationGroup);

                const station = {
                    x: rx,
                    z: rz,
                    rotIndex: rotIndex,
                    color: colorObj,
                    group: stationGroup,
                    waitingPassengers: [],
                    openSideTiles: openSideTiles,
                    footprint: footprint
                };

                for (let fp of footprint) {
                    worldObjects.set(getKey(fp.x, fp.z), { type: 'station', station });
                }
                stations.push(station);
                placed = true;

                layStationPlatformTracks(station);

                updateUIStat('val-station-count', stations.length);

                if (stations.length === 3 && !grantedThirdStationShed) {
                    grantedThirdStationShed = true;
                    shedCount++;
                    updateUIStat('shed-count', shedCount);
                }

                if (stations.length === 5 && !grantedFifthStationShed) {
                    grantedFifthStationShed = true;
                    shedCount++;
                    updateUIStat('shed-count', shedCount);
                }
            }
        }

        function spawnPassengerAtStation(station) {
            if (station.waitingPassengers.length >= 4) return;

            const activeColors = stations.map(s => s.color).filter(c => c.name !== station.color.name);
            if (activeColors.length === 0) return;

            const targetColor = activeColors[Math.floor(Math.random() * activeColors.length)];

            const pMesh = createPassengerMesh(targetColor.hex);
            const pIndex = station.waitingPassengers.length;

            const lx = -0.22;
            const lz = 0.12 + pIndex * 0.38;
            const theta = station.rotIndex * (Math.PI / 2);

            const px = station.x + (lx * Math.cos(theta) + lz * Math.sin(theta));
            const pz = station.z + (-lx * Math.sin(theta) + lz * Math.cos(theta));

            pMesh.position.set(px, 0, pz);
            pMesh.rotation.y = theta;
            scene.add(pMesh);

            station.waitingPassengers.push({
                targetColor: targetColor,
                mesh: pMesh,
                spawnTime: clock.getElapsedTime()
            });
        }

        // 9. BFS Pathfinder for Station Steering
        function findShortestDistanceToStationColors(startX, startZ, initialDir, targetColorNames) {
            if (!targetColorNames || targetColorNames.length === 0) return Infinity;

            const queue = [{
                x: startX + DIRS[initialDir].dx,
                z: startZ + DIRS[initialDir].dz,
                entryDir: DIRS[initialDir].opp,
                dist: 1
            }];
            const visited = new Set([getKey(startX, startZ)]);

            while (queue.length > 0) {
                const curr = queue.shift();
                const k = getKey(curr.x, curr.z);

                if (visited.has(k)) continue;
                visited.add(k);

                const obj = worldObjects.get(k);
                if (!obj || (obj.type !== 'track' && obj.type !== 'bridge_track')) continue;

                for (let s of stations) {
                    if (targetColorNames.includes(s.color.name)) {
                        const isAlongOpenSide = s.openSideTiles.some(t => t.x === curr.x && t.z === curr.z);
                        if (isAlongOpenSide) return curr.dist;
                    }
                }

                if (curr.dist > 30) continue;

                const validExits = Array.from(obj.connections).filter(d => d !== curr.entryDir);

                for (let dir of validExits) {
                    const d = DIRS[dir];
                    queue.push({
                        x: curr.x + d.dx,
                        z: curr.z + d.dz,
                        entryDir: d.opp,
                        dist: curr.dist + 1
                    });
                }
            }
            return Infinity;
        }

        // Reverses a train, matching original end-of-rail behavior cleanly
        function reverseTrain(train, pauseDuration = 1.2) {
            train.pauseTimer = pauseDuration;
            train.exchangeState = null;

            const oldEntry = train.entryDir;
            const oldExit = train.exitDir;
            train.entryDir = oldExit;
            train.exitDir = oldEntry;

            train.currentCurve = getCellCurve(train.x, train.z, train.entryDir, train.exitDir);
            train.dist = 0;

            if (train.locomotive) {
                train.locomotive.rotation.y += Math.PI;

                train.trail = [{
                    pos: train.locomotive.position.clone(),
                    rot: train.locomotive.rotation.y
                }];

                const chimneyPos = train.locomotive.position.clone();
                chimneyPos.y += 0.8;
                for (let k = 0; k < 4; k++) {
                    emitSmokeParticle(chimneyPos);
                }
            }
        }

        // 10. Multi-Car Train Engine & Collision Mechanics
        function spawnTrain(startX, startZ, entryDir, exitDir) {
            const engineColor = ENGINE_COLORS[trains.length % ENGINE_COLORS.length];
            const locomotiveGroup = createDetailedLocomotiveMesh(engineColor);
            scene.add(locomotiveGroup);

            const car1Group = createPassengerCarMesh(0x37474F);
            const car2Group = createPassengerCarMesh(0x37474F);
            scene.add(car1Group, car2Group);

            const initialPos = new THREE.Vector3(startX, 0, startZ);

            const train = {
                locomotive: locomotiveGroup,
                car1: car1Group,
                car2: car2Group,
                x: startX,
                z: startZ,
                entryDir: entryDir,
                exitDir: exitDir,
                dist: 0,
                speed: 1.25,
                passengers: [],
                trail: [{ pos: initialPos.clone(), rot: 0 }],
                smokeTimer: 0,
                pauseTimer: 0,
                lastStationStopped: null,
                exchangeState: null
            };

            locomotiveGroup.position.copy(initialPos);
            car1Group.position.copy(initialPos);
            car2Group.position.copy(initialPos);

            trains.push(train);
        }

        function getCellCurve(x, z, entryDir, exitDir) {
            const p0 = new THREE.Vector3(x + 0.5 * DIRS[entryDir].dx, 0, z + 0.5 * DIRS[entryDir].dz);
            const p2 = new THREE.Vector3(x + 0.5 * DIRS[exitDir].dx, 0, z + 0.5 * DIRS[exitDir].dz);
            if (entryDir === DIRS[exitDir].opp) {
                return new THREE.LineCurve3(p0, p2);
            } else {
                return new THREE.QuadraticBezierCurve3(p0, new THREE.Vector3(x, 0, z), p2);
            }
        }

        function updateTrainCarsFromTrail(train) {
            const trail = train.trail;
            if (trail.length < 2) return;

            const targetD1 = 0.95;
            const targetD2 = 1.90;

            let accumulatedDist = 0;
            let car1Set = false;
            let car2Set = false;

            for (let i = 0; i < trail.length - 1; i++) {
                const p1 = trail[i].pos;
                const p2 = trail[i + 1].pos;
                const segDist = p1.distanceTo(p2);

                if (segDist === 0) continue;

                const prevDist = accumulatedDist;
                accumulatedDist += segDist;

                if (!car1Set && accumulatedDist >= targetD1) {
                    const alpha = (targetD1 - prevDist) / segDist;
                    train.car1.position.lerpVectors(p1, p2, alpha);
                    train.car1.rotation.y = lerpAngle(trail[i].rot, trail[i + 1].rot, alpha);
                    car1Set = true;
                }

                if (!car2Set && accumulatedDist >= targetD2) {
                    const alpha = (targetD2 - prevDist) / segDist;
                    train.car2.position.lerpVectors(p1, p2, alpha);
                    train.car2.rotation.y = lerpAngle(trail[i].rot, trail[i + 1].rot, alpha);
                    car2Set = true;

                    trail.length = i + 4;
                    break;
                }
            }
        }

        function checkTrainAhead(train) {
            let currX = train.x;
            let currZ = train.z;
            let dir = train.exitDir;

            for (let step = 1; step <= 2; step++) {
                const nextX = currX + DIRS[dir].dx;
                const nextZ = currZ + DIRS[dir].dz;

                for (let other of trains) {
                    if (other === train) continue;

                    const otherLocoX = Math.round(other.locomotive.position.x);
                    const otherLocoZ = Math.round(other.locomotive.position.z);
                    const otherCar1X = Math.round(other.car1.position.x);
                    const car1Z = Math.round(other.car1.position.z);
                    const otherCar2X = Math.round(other.car2.position.x);
                    const car2Z = Math.round(other.car2.position.z);

                    const isLocoOnTile = (otherLocoX === nextX && otherLocoZ === nextZ) || (other.x === nextX && other.z === nextZ);
                    const isCarOnTile = (otherCar1X === nextX && car1Z === nextZ) || (otherCar2X === nextX && car2Z === nextZ);

                    if (isLocoOnTile || isCarOnTile) {
                        const isHeadOn = isLocoOnTile && (other.exitDir === DIRS[dir].opp || DIRS[other.entryDir]?.opp === dir);
                        return { blocked: true, isHeadOn, otherTrain: other };
                    }
                }

                const k = getKey(nextX, nextZ);
                const obj = worldObjects.get(k);
                if (!obj || (obj.type !== 'track' && obj.type !== 'bridge_track')) break;

                const exits = Array.from(obj.connections).filter(c => c !== DIRS[dir].opp);
                if (exits.length === 1) {
                    dir = exits[0];
                    currX = nextX;
                    currZ = nextZ;
                } else {
                    break;
                }
            }
            return { blocked: false, isHeadOn: false, otherTrain: null };
        }

        function updateTrain(train, delta) {
            // STEP 1: Process Sequential 1-by-1 Passenger Disembarking / Embarking
            if (train.exchangeState) {
                const ex = train.exchangeState;
                ex.timer += delta;

                if (ex.timer >= ex.stepInterval) {
                    ex.timer = 0;

                    if (ex.stage === 'disembark') {
                        if (ex.disembarkIndices.length > 0) {
                            const passIdx = ex.disembarkIndices.pop();
                            const p = train.passengers[passIdx];
                            if (p && p.mesh.parent) {
                                p.mesh.parent.remove(p.mesh);
                            }
                            disposeObject(p.mesh);
                            train.passengers.splice(passIdx, 1);
                            score++;
                            updateUIStat('val-score', score);

                            train.passengers.forEach((pObj, idx) => {
                                const targetCarGroup = (idx < 3) ? train.car1 : train.car2;
                                if (pObj.mesh.parent !== targetCarGroup) {
                                    if (pObj.mesh.parent) pObj.mesh.parent.remove(pObj.mesh);
                                    targetCarGroup.add(pObj.mesh);
                                }
                                const carOffsetIndex = idx % 3;
                                pObj.mesh.position.set(carOffsetIndex * 0.25 - 0.25, 0.3, 0);
                            });

                            ex.disembarkIndices = [];
                            for (let i = train.passengers.length - 1; i >= 0; i--) {
                                if (train.passengers[i].targetColor.name === ex.station.color.name) {
                                    ex.disembarkIndices.push(i);
                                }
                            }
                        }

                        if (ex.disembarkIndices.length === 0) {
                            ex.stage = 'embark';
                        }
                    } else if (ex.stage === 'embark') {
                        if (ex.station.waitingPassengers.length > 0 && train.passengers.length < 6) {
                            const pass = ex.station.waitingPassengers.shift();
                            scene.remove(pass.mesh);
                            disposeObject(pass.mesh);

                            const onboardMesh = createPassengerMesh(pass.targetColor.hex);
                            const targetCarGroup = (train.passengers.length < 3) ? train.car1 : train.car2;
                            const carOffsetIndex = train.passengers.length % 3;

                            targetCarGroup.add(onboardMesh);
                            onboardMesh.position.set(carOffsetIndex * 0.25 - 0.25, 0.3, 0);

                            train.passengers.push({
                                targetColor: pass.targetColor,
                                mesh: onboardMesh
                            });

                            ex.station.waitingPassengers.forEach((pObj, idx) => {
                                const lx = -0.22;
                                const lz = 0.12 + idx * 0.38;
                                const theta = ex.station.rotIndex * (Math.PI / 2);
                                const px = ex.station.x + (lx * Math.cos(theta) + lz * Math.sin(theta));
                                const pz = ex.station.z + (-lx * Math.sin(theta) + lz * Math.cos(theta));
                                pObj.mesh.position.set(px, 0, pz);
                            });
                        } else {
                            train.exchangeState = null;
                            train.pauseTimer = 0.4;
                        }
                    }
                }
                return;
            }

            if (train.pauseTimer > 0) {
                train.pauseTimer -= delta;
                return;
            }

            const currKey = getKey(train.x, train.z);
            const currObj = worldObjects.get(currKey);

            if (!currObj || (currObj.type !== 'track' && currObj.type !== 'bridge_track')) return;

            // STEP 2: Junction Steering
            if (!train.currentCurve) {
                const availableExits = Array.from(currObj.connections).filter(c => c !== train.entryDir);
                let exitDir;

                if (availableExits.length > 1) {
                    let bestExit = null;
                    let minDistance = Infinity;

                    if (train.passengers.length > 0) {
                        const dropoffColors = Array.from(new Set(train.passengers.map(p => p.targetColor.name)));
                        for (let optionDir of availableExits) {
                            const dist = findShortestDistanceToStationColors(train.x, train.z, optionDir, dropoffColors);
                            if (dist < minDistance) {
                                minDistance = dist;
                                bestExit = optionDir;
                            }
                        }
                    }

                    if (minDistance === Infinity && train.passengers.length < 6) {
                        const pickupColors = [];
                        stations.forEach(s => {
                            if (s.waitingPassengers.length > 0) {
                                pickupColors.push(s.color.name);
                            }
                        });

                        if (pickupColors.length > 0) {
                            for (let optionDir of availableExits) {
                                const dist = findShortestDistanceToStationColors(train.x, train.z, optionDir, pickupColors);
                                if (dist < minDistance) {
                                    minDistance = dist;
                                    bestExit = optionDir;
                                }
                            }
                        }
                    }

                    if (minDistance === Infinity || !bestExit) {
                        const nextIdx = (currObj.switchIndex + 1) % availableExits.length;
                        bestExit = availableExits[nextIdx] || availableExits[0];
                    }

                    exitDir = bestExit;

                    if (currObj.type === 'track' && currObj.connections.size === 3) {
                        const missing = ['N', 'E', 'S', 'W'].find(d => !currObj.connections.has(d));
                        const baseDir = DIRS[missing].opp;
                        const rel = getRelativeLeftRight(baseDir);

                        if (exitDir === rel.left) {
                            currObj.switchIndex = 0;
                        } else if (exitDir === rel.right) {
                            currObj.switchIndex = 1;
                        }
                        setTrack(currObj.x, currObj.z, currObj.connections, currObj.switchIndex);
                    }
                } else if (availableExits.length === 1) {
                    exitDir = availableExits[0];
                } else {
                    exitDir = DIRS[train.entryDir].opp;
                }

                train.exitDir = exitDir;
                train.currentCurve = getCellCurve(train.x, train.z, train.entryDir, exitDir);
                train.curveLength = train.currentCurve.getLength();
            }

            if (train.dist >= train.curveLength - 0.15) {
                const status = checkTrainAhead(train);
                if (status.blocked) {
                    if (!status.isHeadOn) {
                        train.pauseTimer = 0.3;
                        return;
                    } else {
                        const other = status.otherTrain;
                        const pSelf = train.passengers.length;
                        const pOther = other ? other.passengers.length : 0;

                        let shouldSelfReverse = false;
                        if (pSelf < pOther) {
                            shouldSelfReverse = true;
                        } else if (pSelf > pOther) {
                            shouldSelfReverse = false;
                        } else {
                            shouldSelfReverse = trains.indexOf(train) < trains.indexOf(other);
                        }

                        if (shouldSelfReverse) {
                            train.waitCount = (train.waitCount || 0) + 1;
                            if (train.waitCount >= 2) {
                                train.waitCount = 0;
                                reverseTrain(train, 0.8);
                                if (other) other.pauseTimer = 1.4;
                                return;
                            } else {
                                train.pauseTimer = 0.3;
                                return;
                            }
                        } else {
                            train.pauseTimer = 0.4;
                            return;
                        }
                    }
                } else {
                    train.waitCount = 0;
                }
            }

            train.dist += train.speed * delta;

            if (train.dist >= train.curveLength) {
                const nextX = train.x + DIRS[train.exitDir].dx;
                const nextZ = train.z + DIRS[train.exitDir].dz;
                const nextKey = getKey(nextX, nextZ);
                const nextObj = worldObjects.get(nextKey);

                if (nextObj && (nextObj.type === 'track' || nextObj.type === 'bridge_track')) {
                    train.dist -= train.curveLength;
                    train.x = nextX;
                    train.z = nextZ;
                    train.entryDir = DIRS[train.exitDir].opp;
                    train.currentCurve = null;
                } else {
                    // Dead end: reverse in place
                    reverseTrain(train, 0.0);
                }
            }

            if (train.currentCurve) {
                const t = Math.min(Math.max(train.dist / train.curveLength, 0), 1);
                train.locomotive.position.copy(train.currentCurve.getPointAt(t));
                const tan = train.currentCurve.getTangentAt(t);
                train.locomotive.rotation.y = lerpAngle(train.locomotive.rotation.y, Math.atan2(-tan.z, tan.x), 0.25);

                const headPos = train.locomotive.position.clone();
                if (train.trail.length === 0 || headPos.distanceTo(train.trail[0].pos) > 0.02) {
                    train.trail.unshift({
                        pos: headPos,
                        rot: train.locomotive.rotation.y
                    });
                }

                updateTrainCarsFromTrail(train);

                // STEP 3: Detect Station Arrival & Initiate Sequential Exchange
                const car1X = Math.round(train.car1.position.x);
                const car1Z = Math.round(train.car1.position.z);

                stations.forEach(station => {
                    const isCarAlignedOnOpenPlatform = station.openSideTiles.some(t => t.x === car1X && t.z === car1Z);

                    if (isCarAlignedOnOpenPlatform) {
                        if (train.lastStationStopped !== station) {
                            const disembarkIndices = [];
                            for (let i = train.passengers.length - 1; i >= 0; i--) {
                                if (train.passengers[i].targetColor.name === station.color.name) {
                                    disembarkIndices.push(i);
                                }
                            }

                            const hasDisembark = disembarkIndices.length > 0;
                            const hasEmbark = station.waitingPassengers.length > 0 && train.passengers.length < 6;

                            if (hasDisembark || hasEmbark) {
                                train.lastStationStopped = station;
                                train.exchangeState = {
                                    station: station,
                                    disembarkIndices: disembarkIndices,
                                    stage: hasDisembark ? 'disembark' : 'embark',
                                    timer: 0.2,
                                    stepInterval: 0.45
                                };
                            }
                        }
                    } else {
                        if (train.lastStationStopped === station) {
                            train.lastStationStopped = null;
                        }
                    }
                });

                train.smokeTimer += delta;
                if (train.smokeTimer >= 0.08) {
                    train.smokeTimer = 0;
                    const chimneyPos = train.locomotive.position.clone();
                    chimneyPos.y += 1.0;
                    emitSmokeParticle(chimneyPos);
                }
            }
        }

        // Head-On Collision Handler: Select train with FEWER passengers to reverse
        function checkTrainCollisions() {
            for (let i = 0; i < trains.length; i++) {
                for (let j = i + 1; j < trains.length; j++) {
                    const t1 = trains[i];
                    const t2 = trains[j];

                    if (t1.pauseTimer > 0.8 || t2.pauseTimer > 0.8) continue;

                    const p1 = t1.locomotive.position;
                    const p2 = t2.locomotive.position;

                    if (p1.distanceTo(p2) < 0.85) {
                        const p1Count = t1.passengers.length;
                        const p2Count = t2.passengers.length;

                        let reversingTrain, waitingTrain;
                        if (p1Count < p2Count) {
                            reversingTrain = t1;
                            waitingTrain = t2;
                        } else if (p2Count < p1Count) {
                            reversingTrain = t2;
                            waitingTrain = t1;
                        } else {
                            reversingTrain = t1;
                            waitingTrain = t2;
                        }

                        reverseTrain(reversingTrain, 0.8);
                        waitingTrain.pauseTimer = 1.4;
                    }
                }
            }
        }

        // Initialize Starting 2 Stations
        spawnRandomStation();
        spawnRandomStation();

        // 11. Multi-Touch System & Interactive Tool Handlers
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const intersectPoint = new THREE.Vector3();

        function getGridPosFromCoords(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(groundPlane, intersectPoint)) {
                return {
                    x: Math.round(intersectPoint.x),
                    z: Math.round(intersectPoint.z)
                };
            }
            return null;
        }

        function getGridPos(e) {
            return getGridPosFromCoords(e.clientX, e.clientY);
        }

        const activePointers = new Map();

        function recordTileSnapshotForPointer(pointerState, x, z) {
            const key = getKey(x, z);
            if (!pointerState.dragTileMap.has(key)) {
                const obj = worldObjects.get(key);
                let snap = null;
                if (obj) {
                    if (obj.type === 'tree') snap = { type: 'tree', group: obj.group };
                    else if (obj.type === 'track') snap = { type: 'track', x: obj.x, z: obj.z, connections: new Set(obj.connections), switchIndex: obj.switchIndex };
                    else if (obj.type === 'bridge_track') snap = { type: 'bridge_track', x: obj.x, z: obj.z, connections: new Set(obj.connections), bridgeRef: obj.bridgeRef };
                    else snap = { type: obj.type, obj: obj };
                }
                pointerState.dragTileMap.set(key, snap);
            }
        }

        function restoreSnapshotsForPointer(pointerState) {
            for (let [key, snap] of pointerState.dragTileMap.entries()) {
                const current = worldObjects.get(key);
                if (snap === null) {
                    if (current && current.type === 'track') {
                        scene.remove(current.group);
                        disposeObject(current.group);
                        worldObjects.delete(key);
                    }
                } else if (snap.type === 'tree') {
                    if (current && current.type === 'track') {
                        scene.remove(current.group);
                        disposeObject(current.group);
                        scene.add(snap.group);
                        worldObjects.set(key, { type: 'tree', group: snap.group });
                    }
                } else if (snap.type === 'track') {
                    setTrack(snap.x, snap.z, snap.connections, snap.switchIndex);
                } else if (snap.type === 'bridge_track') {
                    if (current && current.type === 'bridge_track') {
                        current.connections = new Set(snap.connections);
                    }
                }
            }
        }

        function connectTwoTiles(P1, P2) {
            let dir1To2 = null;
            if (P2.x > P1.x) dir1To2 = 'E';
            else if (P2.x < P1.x) dir1To2 = 'W';
            else if (P2.z > P1.z) dir1To2 = 'S';
            else if (P2.z < P1.z) dir1To2 = 'N';

            if (!dir1To2) return;
            const dir2To1 = DIRS[dir1To2].opp;

            const key1 = getKey(P1.x, P1.z);
            const key2 = getKey(P2.x, P2.z);

            let obj1 = worldObjects.get(key1);
            let obj2 = worldObjects.get(key2);

            if (obj1 && obj1.type === 'tree') {
                scene.remove(obj1.group);
                worldObjects.delete(key1);
                obj1 = null;
            }
            if (obj2 && obj2.type === 'tree') {
                scene.remove(obj2.group);
                worldObjects.delete(key2);
                obj2 = null;
            }

            if ((obj1 && obj1.type !== 'track' && obj1.type !== 'bridge_track') ||
                (obj2 && obj2.type !== 'track' && obj2.type !== 'bridge_track')) {
                return;
            }

            if (obj1 && (obj1.type === 'track' || obj1.type === 'bridge_track')) {
                if (!obj1.connections.has(dir1To2) && obj1.connections.size >= 3) {
                    return;
                }
            }
            if (obj2 && (obj2.type === 'track' || obj2.type === 'bridge_track')) {
                if (!obj2.connections.has(dir2To1) && obj2.connections.size >= 3) {
                    return;
                }
            }

            const conn1 = obj1 ? new Set(obj1.connections) : new Set();
            conn1.add(dir1To2);

            const conn2 = obj2 ? new Set(obj2.connections) : new Set();
            conn2.add(dir2To1);

            if (!obj1 || obj1.type === 'track') {
                setTrack(P1.x, P1.z, conn1, obj1 ? obj1.switchIndex : 0);
            } else if (obj1.type === 'bridge_track') {
                obj1.connections.add(dir1To2);
            }

            if (!obj2 || obj2.type === 'track') {
                setTrack(P2.x, P2.z, conn2, obj2 ? obj2.switchIndex : 0);
            } else if (obj2.type === 'bridge_track') {
                obj2.connections.add(dir2To1);
            }
        }

        function applyDragPathForPointer(pointerState) {
            restoreSnapshotsForPointer(pointerState);

            const dragPath = pointerState.dragPath;
            if (dragPath.length === 1) {
                const P0 = dragPath[0];
                const key0 = getKey(P0.x, P0.z);
                const snap0 = pointerState.dragTileMap.get(key0);

                if (snap0 === null || snap0.type === 'tree') {
                    if (snap0 && snap0.type === 'tree') {
                        scene.remove(snap0.group);
                    }

                    const newConnections = new Set();
                    for (let dKey of ['N', 'E', 'S', 'W']) {
                        if (newConnections.size >= 3) break;
                        const d = DIRS[dKey];
                        const nKey = getKey(P0.x + d.dx, P0.z + d.dz);
                        const neighbor = worldObjects.get(nKey);

                        if (neighbor && (neighbor.type === 'track' || neighbor.type === 'bridge_track') && neighbor.connections.size < 3) {
                            newConnections.add(dKey);
                            neighbor.connections.add(d.opp);
                            if (neighbor.type === 'track') {
                                setTrack(neighbor.x, neighbor.z, neighbor.connections, neighbor.switchIndex);
                            }
                        }
                    }

                    if (newConnections.size === 0) {
                        newConnections.add('E');
                        newConnections.add('W');
                    }

                    setTrack(P0.x, P0.z, newConnections, 0);
                }
                return;
            }

            for (let i = 0; i < dragPath.length - 1; i++) {
                connectTwoTiles(dragPath[i], dragPath[i + 1]);
            }
        }

        function handlePointerTrackDrag(pointerState, targetGridPos) {
            const dragPath = pointerState.dragPath;
            if (!isValidBuildBounds(targetGridPos)) return;

            let lastP = dragPath[dragPath.length - 1];
            if (lastP.x === targetGridPos.x && lastP.z === targetGridPos.z) {
                return;
            }

            let currX = lastP.x;
            let currZ = lastP.z;

            while (currX !== targetGridPos.x || currZ !== targetGridPos.z) {
                let nextX = currX;
                let nextZ = currZ;

                if (currX !== targetGridPos.x) {
                    nextX += Math.sign(targetGridPos.x - currX);
                } else if (currZ !== targetGridPos.z) {
                    nextZ += Math.sign(targetGridPos.z - currZ);
                }

                if (!isValidBuildBounds({ x: nextX, z: nextZ })) break;

                const nextKey = getKey(nextX, nextZ);
                const targetObj = worldObjects.get(nextKey);

                if (targetObj && (targetObj.type === 'station' || targetObj.type === 'border_tree' || targetObj.type === 'bridge')) {
                    break;
                }

                if (dragPath.length >= 2) {
                    const prevP = dragPath[dragPath.length - 2];
                    if (prevP.x === nextX && prevP.z === nextZ) {
                        dragPath.pop();
                        currX = nextX;
                        currZ = nextZ;
                        continue;
                    }
                }

                recordTileSnapshotForPointer(pointerState, nextX, nextZ);
                dragPath.push({ x: nextX, z: nextZ });

                currX = nextX;
                currZ = nextZ;
            }

            applyDragPathForPointer(pointerState);
        }

        // Bind Pointer Events to UI Buttons
        document.querySelectorAll('.shed-drag-source').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                if (shedCount <= 0) return;
                e.preventDefault();
                e.stopPropagation();
                activePointers.set(e.pointerId, {
                    tool: 'shed',
                    pointerId: e.pointerId
                });
                updateGhostMesh(e);
            });
        });

        document.querySelectorAll('.demolish-drag-source').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                activePointers.set(e.pointerId, {
                    tool: 'demolish',
                    pointerId: e.pointerId
                });
                updateDemolishGhostMesh(e);
            });
        });

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.ui-sidebar')) return;
            const gridPos = getGridPos(e);

            if (e.button === 2 && gridPos) {
                removeObjectAt(gridPos.x, gridPos.z);
                return;
            }

            if (gridPos && isValidBuildBounds(gridPos)) {
                const pointerState = {
                    tool: 'track',
                    pointerId: e.pointerId,
                    dragPath: [{ x: gridPos.x, z: gridPos.z }],
                    dragTileMap: new Map()
                };
                recordTileSnapshotForPointer(pointerState, gridPos.x, gridPos.z);
                activePointers.set(e.pointerId, pointerState);
                applyDragPathForPointer(pointerState);
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!activePointers.has(e.pointerId)) return;
            const pState = activePointers.get(e.pointerId);

            if (pState.tool === 'shed') {
                updateGhostMesh(e);
            } else if (pState.tool === 'demolish') {
                updateDemolishGhostMesh(e);
            } else if (pState.tool === 'track') {
                const gridPos = getGridPos(e);
                if (gridPos) {
                    handlePointerTrackDrag(pState, gridPos);
                }
            }
        });

        function handlePointerUp(e) {
            if (!activePointers.has(e.pointerId)) return;
            const pState = activePointers.get(e.pointerId);

            const gridPos = getGridPos(e);

            if (pState.tool === 'shed' && gridPos && shedCount > 0) {
                if (placeCoveredBridgeShed(gridPos.x, gridPos.z)) {
                    shedCount--;
                    updateUIStat('shed-count', shedCount);
                }
            } else if (pState.tool === 'demolish' && gridPos) {
                const key = getKey(gridPos.x, gridPos.z);
                const obj = worldObjects.get(key);
                if (obj && obj.type === 'track') {
                    removeObjectAt(gridPos.x, gridPos.z);
                }
            }

            activePointers.delete(e.pointerId);

            let hasShed = false;
            let hasDemolish = false;
            for (let state of activePointers.values()) {
                if (state.tool === 'shed') hasShed = true;
                if (state.tool === 'demolish') hasDemolish = true;
            }
            if (!hasShed) ghostMesh.visible = false;
            if (!hasDemolish) demolishGhostMesh.visible = false;
        }

        window.addEventListener('pointerup', handlePointerUp);
        window.addEventListener('pointercancel', handlePointerUp);
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        // 12. Simulation Loop & Real-Time Waiting Passenger Analytics
        let stationCheckTimer = 0;
        let passengerTimer = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta();
            if (delta > 0.1) delta = 0.1;

            stationCheckTimer += delta;
            passengerTimer += delta;

            let totalCurrentWait = 0;
            totalWaitingCount = 0;
            const now = clock.getElapsedTime();

            stations.forEach(s => {
                s.waitingPassengers.forEach(p => {
                    totalCurrentWait += (now - p.spawnTime);
                    totalWaitingCount++;
                });
            });

            rollingAvgWait = totalWaitingCount > 0 ? (totalCurrentWait / totalWaitingCount) : 0;
            updateUIStat('val-avg-wait', rollingAvgWait.toFixed(1) + 's');

            if (stationCheckTimer > 18 && stations.length < 6) {
                stationCheckTimer = 0;
                if (stations.length < 3 || (totalWaitingCount > 0 && rollingAvgWait < 14.0) || totalWaitingCount === 0) {
                    spawnRandomStation();
                }
            }

            if (passengerTimer > 4.5 && stations.length > 0) {
                const randStation = stations[Math.floor(Math.random() * stations.length)];
                spawnPassengerAtStation(randStation);
                passengerTimer = 0;
            }

            trains.forEach(t => updateTrain(t, delta));
            checkTrainCollisions();
            updateSmokeParticles(delta);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 13. Idle Timeout System (10 Minutes)
        const IDLE_TIMEOUT_MS = 10 * 60 * 1000;
        let idleTimer = null;

        function resetIdleTimer() {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                window.location.href = 'index.html';
            }, IDLE_TIMEOUT_MS);
        }

        ['pointerdown', 'pointermove', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
            window.addEventListener(evt, resetIdleTimer, { passive: true });
        });

        resetIdleTimer();

        animate();
    </script>
</body>
</html>
