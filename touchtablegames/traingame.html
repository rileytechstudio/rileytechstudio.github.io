<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Top-Down Railway Tycoon</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #87CEEB; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none;
        }

        /* Minimalist UI Sidebars */
        .ui-sidebar {
            position: absolute;
            top: 50%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            align-items: center;
            z-index: 10;
        }

        /* Left Player UI */
        #ui-container-left {
            left: 20px;
            transform: translateY(-50%);
        }

        /* Right Player UI (Rotated 180° for Tabletop Play) */
        #ui-container-right {
            right: 20px;
            transform: translateY(-50%) rotate(180deg);
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            touch-action: none;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .tool-btn.active {
            background: #1E88E5;
            border-color: #64B5F6;
            box-shadow: 0 0 12px rgba(30, 136, 229, 0.6);
        }

        .tool-btn.danger:hover {
            background: #D32F2F;
            border-color: #FF6666;
            box-shadow: 0 0 12px rgba(211, 47, 47, 0.6);
        }

        .shed-drag-source {
            background: rgba(191, 54, 12, 0.35);
            border-color: #FF7043;
            cursor: grab;
        }
        .shed-drag-source:hover {
            background: rgba(191, 54, 12, 0.7);
        }

        .demolish-drag-source {
            background: rgba(198, 40, 40, 0.35);
            border-color: #EF5350;
            cursor: grab;
        }
        .demolish-drag-source:hover {
            background: rgba(198, 40, 40, 0.7);
        }

        .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #FF7043;
            color: white;
            font-size: 11px;
            font-weight: bold;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            border: 1.5px solid #12161C;
        }

        .ui-divider {
            width: 100%;
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            margin: 2px 0;
        }

        .stat-badge {
            width: 100%;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            padding: 0 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 13px;
            font-weight: 600;
            color: #E0E0E0;
        }

        .stat-badge span {
            margin-left: auto;
            font-family: 'Consolas', 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <!-- Left Player UI Sidebar -->
    <div id="ui-container-left" class="ui-sidebar">
        <button class="tool-btn danger btn-exit" onclick="window.location.href='index.html'" title="Exit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>

        <hr class="ui-divider">

        <div class="tool-btn active" title="Lay Track">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18M20 3v18M4 7h16M4 12h16M4 17h16"/></svg>
        </div>

        <div class="tool-btn shed-drag-source" title="Drag Shed">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="12" rx="2"/><path d="M4 11h16"/><circle cx="8" cy="18" r="2"/><circle cx="16" cy="18" r="2"/><path d="M8 15h8"/></svg>
            <span class="badge-count shed-count">1</span>
        </div>

        <div class="tool-btn demolish-drag-source" title="Demolish">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
        </div>

        <hr class="ui-divider">

        <div class="stat-badge" title="Score">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span class="val-score">0</span>
        </div>

        <div class="stat-badge" title="Avg Wait">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64B5F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="val-avg-wait">0.0s</span>
        </div>

        <div class="stat-badge" title="Stations">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#81C784" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 10h6M9 14h6M9 18h6"/></svg>
            <span><span class="val-station-count">2</span>/6</span>
        </div>
    </div>

    <!-- Right Player UI Sidebar (Upside Down 180°) -->
    <div id="ui-container-right" class="ui-sidebar">
        <button class="tool-btn danger btn-exit" onclick="window.location.href='index.html'" title="Exit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>

        <hr class="ui-divider">

        <div class="tool-btn active" title="Lay Track">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v18M20 3v18M4 7h16M4 12h16M4 17h16"/></svg>
        </div>

        <div class="tool-btn shed-drag-source" title="Drag Shed">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="12" rx="2"/><path d="M4 11h16"/><circle cx="8" cy="18" r="2"/><circle cx="16" cy="18" r="2"/><path d="M8 15h8"/></svg>
            <span class="badge-count shed-count">1</span>
        </div>

        <div class="tool-btn demolish-drag-source" title="Demolish">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
        </div>

        <hr class="ui-divider">

        <div class="stat-badge" title="Score">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD54F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span class="val-score">0</span>
        </div>

        <div class="stat-badge" title="Avg Wait">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64B5F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="val-avg-wait">0.0s</span>
        </div>

        <div class="stat-badge" title="Stations">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#81C784" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 10h6M9 14h6M9 18h6"/></svg>
            <span><span class="val-station-count">2</span>/6</span>
        </div>
    </div>

    <!-- Import Three.js -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- GPU MEMORY DISPOSAL HELPER ---
        function disposeObject(obj) {
            if (!obj) return;
            obj.traverse((child) => {
                if (child.isMesh) {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.dispose());
                        } else {
                            child.material.dispose();
                        }
                    }
                }
            });
        }

        // 1. Playable Map Limits & Directions System
        const MAP_BOUNDS = { minX: -22, maxX: 22, minZ: -12, maxZ: 12 };

        function isValidBuildBounds(pos) {
            return pos && pos.x > MAP_BOUNDS.minX && pos.x < MAP_BOUNDS.maxX &&
                   pos.z > MAP_BOUNDS.minZ && pos.z < MAP_BOUNDS.maxZ;
        }

        const DIRS = {
            N: { dx: 0, dz: -1, opp: 'S' },
            E: { dx: 1, dz: 0, opp: 'W' },
            S: { dx: 0, dz: 1, opp: 'N' },
            W: { dx: -1, dz: 0, opp: 'E' }
        };

        const STATION_COLORS = [
            { name: 'Red', hex: 0xE53935 },
            { name: 'Blue', hex: 0x1E88E5 },
            { name: 'Yellow', hex: 0xFBC02D },
            { name: 'Green', hex: 0x43A047 },
            { name: 'Purple', hex: 0x8E24AA },
            { name: 'Orange', hex: 0xFB8C00 }
        ];

        const ENGINE_COLORS = [
            0xC62828, // Crimson Red
            0x1565C0, // Sapphire Blue
            0x2E7D32, // Emerald Green
            0x6A1B9A, // Deep Purple
            0xD84315, // Amber Orange
            0x00838F, // Deep Teal
            0x37474F, // Slate Charcoal
            0xAD1457  // Rose Magenta
        ];

        function getKey(x, z) { return `${x},${z}`; }
        function lerpAngle(start, end, amount) {
            let diff = end - start;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return start + diff * amount;
        }
        function getRelativeLeftRight(baseDir) {
            if (baseDir === 'N') return { left: 'E', right: 'W' };
            if (baseDir === 'S') return { left: 'W', right: 'E' };
            if (baseDir === 'E') return { left: 'S', right: 'N' };
            if (baseDir === 'W') return { left: 'N', right: 'S' };
        }

        function updateUIStat(className, value) {
            document.querySelectorAll('.' + className).forEach(el => el.innerText = value);
        }

        // 2. Scene, Overhead Camera & Lighting
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 22, 0);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        renderer.domElement.addEventListener('webglcontextlost', (e) => {
            e.preventDefault();
            console.warn("WebGL Context Lost. Pausing simulation...");
        }, false);

        renderer.domElement.addEventListener('webglcontextrestored', () => {
            console.log("WebGL Context Restored. Resuming...");
        }, false);

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(10, 35, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Ground & Grid
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            new THREE.MeshLambertMaterial({ color: 0x51b848 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(300, 300, 0x3d9e35, 0x3d9e35);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // World Data Storage
        const worldObjects = new Map();
        const bridges = [];
        const stations = [];
        const trains = [];
        const smokeParticles = [];

        let rollingAvgWait = 0;
        let totalWaitingCount = 0;

        // 3. Coniferous Tree Builders
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5d4037 });

        const BORDER_TREE_COLORS = [0x14380D, 0x1B4312, 0x0F2E08, 0x1E4B16, 0x11320A];
        const borderMaterials = BORDER_TREE_COLORS.map(c => new THREE.MeshLambertMaterial({ color: c }));

        const FOREST_FLOOR_COLORS = [0x422D1C, 0x3D2817, 0x48301E, 0x392414];
        const forestFloorMaterials = FOREST_FLOOR_COLORS.map(c => new THREE.MeshLambertMaterial({ color: c }));
        const forestFloorGeo = new THREE.PlaneGeometry(1.0, 1.0);

        const INTERIOR_TREE_COLORS = [0x2E7D32, 0x388E3C, 0x2E6B27, 0x43A047, 0x1B5E20, 0x33691E];
        const interiorMaterials = INTERIOR_TREE_COLORS.map(c => new THREE.MeshLambertMaterial({ color: c }));

        function createBorderTreeMesh() {
            const group = new THREE.Group();
            const mat = borderMaterials[Math.floor(Math.random() * borderMaterials.length)];

            const floorMat = forestFloorMaterials[Math.floor(Math.random() * forestFloorMaterials.length)];
            const floorTile = new THREE.Mesh(forestFloorGeo, floorMat);
            floorTile.rotation.x = -Math.PI / 2;
            floorTile.position.y = 0.005;
            group.add(floorTile);

            const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 0.3), trunkMat);
            trunk.position.y = 0.3;
            group.add(trunk);

            const layer1 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.9), mat);
            layer1.position.y = 0.85;

            const layer2 = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.5, 0.65), mat);
            layer2.position.y = 1.35;

            const layer3 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.45, 0.4), mat);
            layer3.position.y = 1.825;

            group.add(layer1, layer2, layer3);

            const sy = 0.85 + Math.random() * 0.3;
            group.scale.set(1.0, sy, 1.0);

            return group;
        }

        function createInteriorTreeMesh() {
            const group = new THREE.Group();
            const mat = interiorMaterials[Math.floor(Math.random() * interiorMaterials.length)];

            const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 0.3), trunkMat);
            trunk.position.y = 0.3;
            group.add(trunk);

            const layer1 = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.45, 0.85), mat);
            layer1.position.y = 0.825;

            const layer2 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.45, 0.6), mat);
            layer2.position.y = 1.275;

            const layer3 = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.4, 0.35), mat);
            layer3.position.y = 1.7;

            group.add(layer1, layer2, layer3);

            const sy = 0.85 + Math.random() * 0.3;
            group.scale.set(1.0, sy, 1.0);

            return group;
        }

        // Build 3 Rows of Border Trees
        const BORDER_DEPTH = 3;
        for (let x = MAP_BOUNDS.minX - BORDER_DEPTH; x <= MAP_BOUNDS.maxX + BORDER_DEPTH; x++) {
            for (let z = MAP_BOUNDS.minZ - BORDER_DEPTH; z <= MAP_BOUNDS.maxZ + BORDER_DEPTH; z++) {
                const isBorder = (x <= MAP_BOUNDS.minX || x >= MAP_BOUNDS.maxX || z <= MAP_BOUNDS.minZ || z >= MAP_BOUNDS.maxZ);
                if (isBorder) {
                    const key = getKey(x, z);
                    const treeGroup = createBorderTreeMesh();
                    treeGroup.position.set(x, 0, z);
                    scene.add(treeGroup);
                    worldObjects.set(key, { type: 'border_tree', group: treeGroup });
                }
            }
        }

        // Interior Decorative Trees Scatter
        for (let i = 0; i < 75; i++) {
            const rx = Math.floor(Math.random() * (MAP_BOUNDS.maxX - MAP_BOUNDS.minX - 2)) + MAP_BOUNDS.minX + 1;
            const rz = Math.floor(Math.random() * (MAP_BOUNDS.maxZ - MAP_BOUNDS.minZ - 2)) + MAP_BOUNDS.minZ + 1;
            const key = getKey(rx, rz);
            if (!worldObjects.has(key) && (Math.abs(rx) > 4 || Math.abs(rz) > 4)) {
                const treeGroup = createInteriorTreeMesh();
                treeGroup.position.set(rx, 0, rz);
                scene.add(treeGroup);
                worldObjects.set(key, { type: 'tree', group: treeGroup });
            }
        }

        // 4. Track, Covered Bridge Shed & Station Builders
        const woodMat = new THREE.MeshLambertMaterial({ color: 0x6d4c41 });
        const railMat = new THREE.MeshLambertMaterial({ color: 0x757575 });

        function createTrackMesh(connections, switchIndex = 0) {
            const group = new THREE.Group();
            const connArr = Array.from(connections);

            if (connArr.length === 3) {
                const missing = ['N', 'E', 'S', 'W'].find(d => !connections.has(d));
                const base = DIRS[missing].opp;
                const rel = getRelativeLeftRight(base);
                const activeExit = (switchIndex === 0) ? rel.left : rel.right;

                for (let x = -0.3; x <= 0.3; x += 0.3) {
                    for (let z = -0.3; z <= 0.3; z += 0.3) {
                        if (Math.abs(x) < 0.1 || Math.abs(z) < 0.1) {
                            const tie = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 0.3), woodMat);
                            tie.position.set(x, 0.02, z);
                            group.add(tie);
                        }
                    }
                }
                connections.forEach(dir => {
                    const d = DIRS[dir];
                    if (dir === 'N' || dir === 'S') {
                        const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.5), railMat);
                        const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.5), railMat);
                        r1.position.set(0.25, 0.08, d.dz * 0.25);
                        r2.position.set(-0.25, 0.08, d.dz * 0.25);
                        group.add(r1, r2);
                    } else {
                        const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.08), railMat);
                        const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.08), railMat);
                        r1.position.set(d.dx * 0.25, 0.08, 0.25);
                        r2.position.set(d.dx * 0.25, 0.08, -0.25);
                        group.add(r1, r2);
                    }
                });

                const offsetD = DIRS[missing];
                const switchBox = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.25), new THREE.MeshLambertMaterial({ color: 0x333333 }));
                switchBox.position.set(offsetD.dx * 0.38, 0.1, offsetD.dz * 0.38);
                group.add(switchBox);

                const activeD = DIRS[activeExit];
                const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.22, 4), new THREE.MeshLambertMaterial({ color: 0x76FF03 }));
                arrow.position.set(offsetD.dx * 0.38 + activeD.dx * 0.12, 0.25, offsetD.dz * 0.38 + activeD.dz * 0.12);
                arrow.rotation.x = Math.PI / 2;
                arrow.rotation.z = Math.atan2(-activeD.dz, activeD.dx);
                group.add(arrow);

            } else {
                const isCorner = connArr.length === 2 && 
                    !((connArr.includes('N') && connArr.includes('S')) || (connArr.includes('E') && connArr.includes('W')));

                if (!isCorner) {
                    const isNS = connArr.includes('N') || connArr.includes('S');
                    if (isNS) {
                        for (let i = -0.3; i <= 0.3; i += 0.3) {
                            const tie = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.18), woodMat);
                            tie.position.set(0, 0.03, i);
                            group.add(tie);
                        }
                        const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 1.0), railMat);
                        const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 1.0), railMat);
                        r1.position.set(0.25, 0.08, 0);
                        r2.position.set(-0.25, 0.08, 0);
                        group.add(r1, r2);
                    } else {
                        for (let i = -0.3; i <= 0.3; i += 0.3) {
                            const tie = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.06, 0.18), woodMat);
                            tie.position.set(i, 0.03, 0);
                            tie.rotation.y = Math.PI / 2;
                            group.add(tie);
                        }
                        const r1 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.12, 0.08), railMat);
                        const r2 = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.12, 0.08), railMat);
                        r1.position.set(0, 0.08, 0.25);
                        r2.position.set(0, 0.08, -0.25);
                        group.add(r1, r2);
                    }
                } else {
                    const subGroup = new THREE.Group();
                    const r1Geo = new THREE.TorusGeometry(0.25, 0.04, 8, 12, Math.PI / 2);
                    r1Geo.rotateX(Math.PI / 2);
                    const r1 = new THREE.Mesh(r1Geo, railMat);
                    const r2Geo = new THREE.TorusGeometry(0.75, 0.04, 8, 12, Math.PI / 2);
                    r2Geo.rotateX(Math.PI / 2);
                    const r2 = new THREE.Mesh(r2Geo, railMat);

                    r1.position.set(-0.5, 0.08, -0.5);
                    r2.position.set(-0.5, 0.08, -0.5);
                    subGroup.add(r1, r2);

            }

        // 5. Shared Geometry Smoke Particle System
        const sharedSmokeGeo = new THREE.SphereGeometry(0.08, 6, 6);

        function emitSmokeParticle(worldPos) {
            const pMat = new THREE.MeshBasicMaterial({ color: 0xF5F5F5, transparent: true, opacity: 0.65 });
            const pMesh = new THREE.Mesh(sharedSmokeGeo, pMat);
            pMesh.position.copy(worldPos);

            scene.add(pMesh);
            smokeParticles.push({
                mesh: pMesh,
                life: 0,
                maxLife: 0.8 + Math.random() * 0.4,
                vx: (Math.random() - 0.5) * 0.25,
                vy: 0.8 + Math.random() * 0.4,
                vz: (Math.random() - 0.5) * 0.25
            });
        }

        function updateSmokeParticles(delta) {
            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const p = smokeParticles[i];
                p.life += delta;

                p.mesh.position.x += p.vx * delta;
                p.mesh.position.y += p.vy * delta;
                p.mesh.position.z += p.vz * delta;

                p.mesh.scale.addScalar(delta * 1.4);
                p.mesh.material.opacity = (1.0 - p.life / p.maxLife) * 0.65;

                if (p.life >= p.maxLife) {
                    scene.remove(p.mesh);
                    p.mesh.material.dispose();
                    smokeParticles.splice(i, 1);
                }
            }
        }

        // 6. Map Handlers & Operations
        function setTrack(x, z, connections, switchIndex = 0) {
            const key = getKey(x, z);
            const existing = worldObjects.get(key);
            if (existing && existing.type === 'track') {
                scene.remove(existing.group);
                disposeObject(existing.group);
            }
            const group = createTrackMesh(connections, switchIndex);
            group.position.set(x, 0, z);
            scene.add(group);
            worldObjects.set(key, { type: 'track', x, z, connections: new Set(connections), group, switchIndex });

            checkBridgeTrainSpawns();
        }

        function removeObjectAt(x, z) {
            const key = getKey(x, z);
            if (!worldObjects.has(key)) return;
            const obj = worldObjects.get(key);
            if (obj.type === 'bridge' || obj.type === 'station' || obj.type === 'border_tree') return;

            scene.remove(obj.group);
            disposeObject(obj.group);
            worldObjects.delete(key);

            if (obj.type === 'track') {
                for (let dKey of ['N', 'E', 'S', 'W']) {
                    const d = DIRS[dKey];
                    const nKey = getKey(x + d.dx, z + d.dz);
                    const neighbor = worldObjects.get(nKey);
                    if (neighbor && neighbor.type === 'track' && neighbor.connections.has(d.opp)) {
                        neighbor.connections.delete(d.opp);
                        setTrack(neighbor.x, neighbor.z, neighbor.connections, neighbor.switchIndex);
                    }
                }
            }
        }

        // 7. Auto-Orienting Covered Bridge Shed Mechanics & Placement Helper
        function getShedOrientationAndValidity(centerX, centerZ) {
            let vertScore = 0;
            let horizScore = 0;

            const centerObj = worldObjects.get(getKey(centerX, centerZ));
            if (centerObj && centerObj.type === 'track') {
                if (centerObj.connections.has('N') || centerObj.connections.has('S')) vertScore += 2;
                if (centerObj.connections.has('E') || centerObj.connections.has('W')) horizScore += 2;
            }

            const northObj = worldObjects.get(getKey(centerX, centerZ - 1));
            const southObj = worldObjects.get(getKey(centerX, centerZ + 1));
            if (northObj && (northObj.type === 'track' || northObj.type === 'bridge_track')) vertScore += 1;
            if (southObj && (southObj.type === 'track' || southObj.type === 'bridge_track')) vertScore += 1;

            const westObj = worldObjects.get(getKey(centerX - 1, centerZ));
            const eastObj = worldObjects.get(getKey(centerX + 1, centerZ));
            if (westObj && (westObj.type === 'track' || westObj.type === 'bridge_track')) horizScore += 1;
            if (eastObj && (eastObj.type === 'track' || eastObj.type === 'bridge_track')) horizScore += 1;

            const isVertical = vertScore > horizScore;

            const tilesToCheck = isVertical ? [
                {x: centerX, z: centerZ - 2},
                {x: centerX, z: centerZ - 1},
                {x: centerX, z: centerZ},
                {x: centerX, z: centerZ + 1},
                {x: centerX, z: centerZ + 2}
            ] : [
                {x: centerX - 2, z: centerZ},
                {x: centerX - 1, z: centerZ},
                {x: centerX, z: centerZ},
                {x: centerX + 1, z: centerZ},
                {x: centerX + 2, z: centerZ}
            ];

            let isValid = true;
            for (let t of tilesToCheck) {
                if (t.x <= MAP_BOUNDS.minX || t.x >= MAP_BOUNDS.maxX ||
                    t.z <= MAP_BOUNDS.minZ || t.z >= MAP_BOUNDS.maxZ) {
                    isValid = false;
                    break;
                }
                const existing = worldObjects.get(getKey(t.x, t.z));
                if (existing) {
                    if (existing.type === 'station' || existing.type === 'border_tree' || existing.type === 'bridge_track' || existing.type === 'bridge') {
                        isValid = false;
                        break;
                    }
                }
            }

            return { isVertical, isValid, keysToCheck: tilesToCheck.map(t => getKey(t.x, t.z)) };
        }

        // Interactive Ghost Preview Mesh
        const ghostValidMat = new THREE.MeshLambertMaterial({ color: 0x66BB6A, transparent: true, opacity: 0.6 });
        const ghostInvalidMat = new THREE.MeshLambertMaterial({ color: 0xEF5350, transparent: true, opacity: 0.6 });

        function createGhostBridgeMesh() {
            const group = createCoveredBridgeMesh();
            group.traverse(child => {
                if (child.isMesh) {
                    child.material = ghostValidMat;
                }
            });

        function updateGhostMesh(e) {
            const gridPos = getGridPos(e);
            if (!gridPos) {
                ghostMesh.visible = false;

            }

            const info = getShedOrientationAndValidity(gridPos.x, gridPos.z);

                }

        function updateDemolishGhostMesh(e) {

            if (!gridPos) {
                demolishGhostMesh.visible = false;

            }
