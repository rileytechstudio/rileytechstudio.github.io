<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Water Table</title>
  <style>
    * {
      touch-action: none;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #233142;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Base Palette UI Styles */
    .ui-palette {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 12px;
      border-radius: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
      border: 4px solid #4dd0e1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    /* Top-Left Menu (Rotated 180° for opposite player) */
    #ui-palette-top {
      top: 20px;
      left: 20px;
      transform: rotate(180deg);
    }

    /* Bottom-Right Menu (Facing normal orientation for primary player) */
    #ui-palette-bottom {
      bottom: 20px;
      right: 20px;
      transform: rotate(0deg);
    }

    .palette-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 2px solid #eceff1;
      gap: 12px;
    }
    .palette-icon-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 4px;
    }
    .palette-title {
      font-size: 13px;
      font-weight: bold;
      color: #37474f;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-exit {
      background: #ff5252;
      color: white;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #d32f2f;
      transition: transform 0.1s, background-color 0.1s;
    }
    .btn-exit:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #d32f2f;
    }
    .cluster-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .palette-divider {
      width: 2px;
      height: 32px;
      background: #cfd8dc;
      border-radius: 1px;
      margin: 0 2px;
    }
    .draggable-card {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #f0f4f8;
      border: 3px solid #b0bec5;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      box-shadow: 0 4px 0 #90a4ae;
      transition: transform 0.1s;
    }
    .draggable-card:active {
      cursor: grabbing;
      transform: scale(1.12);
    }
    .tool-card {
      background: #fff8e1;
      border-color: #ffe082;
      box-shadow: 0 4px 0 #ffb300;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <script>
    // --- SIMULATION PARAMETERS ---
    const NX = 160;
    const NY = 80;
    const L = 0.18;
    
    const DT = 0.0195; 
    const G = 9.81;
    const PIPE_A = 0.12;       
    const DAMPING = 0.992;      
    const SOURCE_DEPTH = 1.16;  
    const DRAIN_SPEED_MULT = 1.4;

    const ITEM_SPEED_MULTIPLIER = 2.0;

    const size = NX * NY;
    const T = new Float32Array(size);
    const TSmooth = new Float32Array(size);
    const d = new Float32Array(size);
    const H = new Float32Array(size);
    
    const fL = new Float32Array(size);
    const fR = new Float32Array(size);
    const fD = new Float32Array(size);
    const fU = new Float32Array(size);

    const Vx = new Float32Array(size);
    const Vy = new Float32Array(size);

    function idx(x, y) { return x + y * NX; }

    function rollingHills(x, y) {
      return (
        Math.sin(x * 0.06 + y * 0.05) * 0.52 +
        Math.cos(x * 0.035 - y * 0.07) * 0.38 +
        Math.sin(x * 0.12 - y * 0.10) * 0.18
      );
    }

    const defaultTerrainBase = 1.21;
    const slopeMagnitude = 0.3;

    // --- INITIALIZE TERRAIN & GRADUAL VALLEY SLOPE TOWARD RIVER ---
    for (let x = 0; x < NX; x++) {
      const progress = x / (NX - 1);
      const centerY = (NY / 2) + Math.sin(progress * Math.PI * 2.5) * (NY * 0.22);
      const channelWidth = 14.5;

      for (let y = 0; y < NY; y++) {
        const i = idx(x, y);
        const dist = Math.abs(y - centerY);
        
        let globalSlope = defaultTerrainBase + (1.0 - progress) * slopeMagnitude;
        let hillHeight = rollingHills(x, y);

        if (progress > 0.8) {
          const taper = (progress - 0.8) / 0.2;
          globalSlope *= (1.0 - taper * 0.65);
          hillHeight *= (1.0 - taper * 0.85);
        }

        const valleySlope = dist * 0.032; 
        const landElevation = globalSlope + hillHeight + valleySlope;

        if (dist < channelWidth) {
          const depthFactor = Math.cos((dist / channelWidth) * (Math.PI / 2));
          T[i] = landElevation - (depthFactor * 1.85);
          d[i] = depthFactor * 0.95;
        } else {
          T[i] = landElevation;
          d[i] = 0.0;
        }
      }
    }

    // --- THREE.JS TOP-DOWN SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x233142);

    const worldWidth = NX * L;
    const worldHeight = NY * L;
    
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
    camera.position.set(worldWidth / 2, 20, worldHeight / 2);
    camera.lookAt(worldWidth / 2, 0, worldHeight / 2);

    function updateCameraFrustum() {
      const newAspect = window.innerWidth / window.innerHeight;
      const groundAspect = worldWidth / worldHeight;
      let viewW, viewH;
      if (newAspect < groundAspect) {
        viewH = worldHeight;
        viewW = worldHeight * newAspect;
      } else {
        viewW = worldWidth;
        viewH = worldWidth / newAspect;
      }
      camera.left = -viewW / 2;
      camera.right = viewW / 2;
      camera.top = viewH / 2;
      camera.bottom = -viewH / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    updateCameraFrustum();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 0.6);
    dirLight.position.set(worldWidth / 2 + 5, 20, worldHeight / 2 - 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- GROUND MESH ---
    const groundGeo = new THREE.PlaneGeometry(worldWidth, worldHeight, NX - 1, NY - 1);
    groundGeo.rotateX(-Math.PI / 2);
    groundGeo.translate(worldWidth / 2, 0, worldHeight / 2);

    const colorAttribute = new Float32Array(size * 3);
    groundGeo.setAttribute('color', new THREE.BufferAttribute(colorAttribute, 3));

    const groundMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.8,
      metalness: 0.05,
      flatShading: false
    });
    const groundMesh = new THREE.Mesh(groundGeo, groundMat);
    groundMesh.receiveShadow = true;
    groundMesh.castShadow = true;
    scene.add(groundMesh);

    // --- SHRUB & FLOWER FOLIAGE SYSTEM ---
    const HIGH_PEAK_THRESHOLD = 1.79;

    const shrubGeo = new THREE.DodecahedronGeometry(0.18, 1);
    const shrubMat = new THREE.MeshStandardMaterial({ color: 0x419d26, roughness: 0.6, flatShading: true });

    const flowerGeo = new THREE.SphereGeometry(0.08, 6, 6);
    const pinkFlowerMat = new THREE.MeshStandardMaterial({ color: 0xff4081, roughness: 0.4 });
    const yellowFlowerMat = new THREE.MeshStandardMaterial({ color: 0xffd54f, roughness: 0.4 });

    const foliageItems = [];
    const dummyMatrix = new THREE.Matrix4();

    for (let y = 3; y < NY - 3; y += 4) {
      for (let x = 3; x < NX - 3; x += 4) {
        const rand = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453 % 1;
        if (rand > 0.45) {
          foliageItems.push({
            type: 'shrub',
            x: x,
            y: y,
            offsetX: (Math.random() - 0.5) * 0.3,
            offsetZ: (Math.random() - 0.5) * 0.3,
            scale: 0.8 + Math.random() * 0.5
          });

          const flowerType = (Math.random() > 0.5) ? 'flower_pink' : 'flower_yellow';
          foliageItems.push({
            type: flowerType,
            x: x,
            y: y,
            offsetX: (Math.random() - 0.5) * 0.5,
            offsetZ: (Math.random() - 0.5) * 0.5,
            scale: 0.7 + Math.random() * 0.4
          });
        }
      }
    }

    const shrubCandidates = foliageItems.filter(f => f.type === 'shrub');
    const pinkFlowerCandidates = foliageItems.filter(f => f.type === 'flower_pink');
    const yellowFlowerCandidates = foliageItems.filter(f => f.type === 'flower_yellow');

    const shrubInstanced = new THREE.InstancedMesh(shrubGeo, shrubMat, shrubCandidates.length || 1);
    const pinkFlowerInstanced = new THREE.InstancedMesh(flowerGeo, pinkFlowerMat, pinkFlowerCandidates.length || 1);
    const yellowFlowerInstanced = new THREE.InstancedMesh(flowerGeo, yellowFlowerMat, yellowFlowerCandidates.length || 1);

    shrubInstanced.castShadow = true;
    pinkFlowerInstanced.castShadow = true;
    yellowFlowerInstanced.castShadow = true;

    scene.add(shrubInstanced);
    scene.add(pinkFlowerInstanced);
    scene.add(yellowFlowerInstanced);

    // --- MAIN WATER MESH ---
    const waterGeo = new THREE.PlaneGeometry(worldWidth, worldHeight, NX - 1, NY - 1);
    waterGeo.rotateX(-Math.PI / 2);
    waterGeo.translate(worldWidth / 2, 0, worldHeight / 2);

    const waterDepthAttribute = new Float32Array(size);
    waterGeo.setAttribute('waterDepth', new THREE.BufferAttribute(waterDepthAttribute, 1));

    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x29b6f6,
      transparent: true,
      opacity: 0.8,
      roughness: 0.1,
      metalness: 0.1,
      transmission: 0.3,
      flatShading: false
    });

    waterMat.onBeforeCompile = (shader) => {
      shader.vertexShader = `
        attribute float waterDepth;
        varying float vWaterDepth;
        ${shader.vertexShader}
      `.replace(
        '#include <begin_vertex>',
        `
        #include <begin_vertex>
        vWaterDepth = waterDepth;
        `
      );

      shader.fragmentShader = `
        varying float vWaterDepth;
        ${shader.fragmentShader}
      `.replace(
        '#include <dithering_fragment>',
        `
        #include <dithering_fragment>
        float shoreEdgeAlpha = smoothstep(0.001, 0.08, vWaterDepth);
        gl_FragColor.a *= shoreEdgeAlpha;
        `
      );
    };

    const waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.receiveShadow = true;
    scene.add(waterMesh);

    // Extended Water Outflow Mesh
    const extWidth = 3.0;
    const waterExtGeo = new THREE.PlaneGeometry(extWidth, worldHeight, 1, NY - 1);
    waterExtGeo.rotateX(-Math.PI / 2);
    waterExtGeo.translate(worldWidth + extWidth / 2, 0, worldHeight / 2);

    const waterExtMesh = new THREE.Mesh(waterExtGeo, waterMat);
    waterExtMesh.receiveShadow = true;
    scene.add(waterExtMesh);

    const sourceInlet = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.8, worldHeight),
      new THREE.MeshStandardMaterial({ color: 0x4dd0e1, roughness: 0.3 })
    );
    sourceInlet.position.set(-0.15, 0.4, worldHeight / 2);
    scene.add(sourceInlet);

    const drainOutlet = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.8, worldHeight),
      new THREE.MeshStandardMaterial({ color: 0xff7043, roughness: 0.3 })
    );
    drainOutlet.position.set(worldWidth + extWidth + 0.15, 0.4, worldHeight / 2);
    scene.add(drainOutlet);

    // --- WATER SPLASH SYSTEM ---
    const visualSplashRipples = [];

    function createSplashEffect(x, y, z) {
      const splashGroup = new THREE.Group();
      splashGroup.position.set(x, y, z);

      const ringGeo = new THREE.RingGeometry(0.05, 0.12, 16);
      ringGeo.rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0xe0f7fa, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);

      const ringMesh2 = ringMesh.clone();
      ringMesh2.scale.set(0.5, 0.5, 0.5);

      splashGroup.add(ringMesh, ringMesh2);

      const droplets = [];
      const dropMat = new THREE.MeshBasicMaterial({ color: 0xb2ebf2, transparent: true, opacity: 0.95 });
      const dropGeo = new THREE.SphereGeometry(0.022, 4, 4);

      for (let dIdx = 0; dIdx < 7; dIdx++) {
        const drop = new THREE.Mesh(dropGeo, dropMat);
        const angle = (dIdx / 7) * Math.PI * 2;
        const spd = 0.35 + Math.random() * 0.45;
        drop.userData = {
          vx: Math.cos(angle) * spd,
          vy: 1.2 + Math.random() * 0.8,
          vz: Math.sin(angle) * spd
        };
        splashGroup.add(drop);
        droplets.push(drop);
      }

      scene.add(splashGroup);

      visualSplashRipples.push({
        group: splashGroup,
        ring1: ringMesh,
        ring2: ringMesh2,
        droplets: droplets,
        age: 0,
        maxAge: 0.75
      });
    }

    function updateSplashEffects() {
      for (let i = visualSplashRipples.length - 1; i >= 0; i--) {
        const splash = visualSplashRipples[i];
        splash.age += DT;

        const progress = splash.age / splash.maxAge;
        const fade = Math.max(0, 1.0 - progress);

        const s1 = 1.0 + progress * 7.5;
        splash.ring1.scale.set(s1, s1, s1);
        splash.ring1.material.opacity = fade * 0.85;

        const s2 = 0.5 + progress * 5.0;
        splash.ring2.scale.set(s2, s2, s2);
        splash.ring2.material.opacity = fade * 0.95;

        splash.droplets.forEach(drop => {
          drop.position.x += drop.userData.vx * DT;
          drop.position.y += drop.userData.vy * DT;
          drop.position.z += drop.userData.vz * DT;

          drop.userData.vy -= 9.8 * DT;
          drop.material.opacity = fade;
        });

        if (splash.age >= splash.maxAge) {
          scene.remove(splash.group);
          visualSplashRipples.splice(i, 1);
        }
      }
    }

    // --- WATER TOUCH INTERACTION DISTURBANCE ---
    function addWaterDisturbance(worldX, worldZ, amount = 0.15, radius = 5) {
      const centerGridX = worldX / L;
      const centerGridY = worldZ / L;

      const rCells = Math.ceil(radius);
      const minX = Math.max(1, Math.floor(centerGridX - rCells));
      const maxX = Math.min(NX - 2, Math.ceil(centerGridX + rCells));
      const minY = Math.max(1, Math.floor(centerGridY - rCells));
      const maxY = Math.min(NY - 2, Math.ceil(centerGridY + rCells));

      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          const dx = x - centerGridX;
          const dy = y - centerGridY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < radius) {
            const i = idx(x, y);
            if (d[i] > 0.02) {
              const falloff = 0.5 * (1 + Math.cos((dist / radius) * Math.PI));
              d[i] += amount * falloff;
            }
          }
        }
      }

      splashEvents.push({
        x: worldX,
        z: worldZ,
        radius: 3.5,
        duration: 0.8
      });
    }

    // --- FISH FLAKES SYSTEM (50% LARGER, SQUARE PLANES, 6-8 PER BATCH) ---
    const activeFlakes = [];

      geo.rotateX(-Math.PI / 2);
      const mat = new THREE.MeshStandardMaterial({

    function createFlakeClusterMesh() {
      const group = new THREE.Group();
      const colors = [0xff7043, 0xffa726, 0xffd54f, 0xff8a65];
      // Batch of 6-8 flakes per drag & drop
      const flakeCount = 6 + Math.floor(Math.random() * 3);

      for (let f = 0; f < flakeCount; f++) {

        mesh.position.set(

        );

    function spawnFishFlakes(worldX, worldZ) {
      const colors = [0xff7043, 0xffa726, 0xffd54f, 0xff8a65];
      // Batch of 6-8 flakes per drop
      const flakeCount = 6 + Math.floor(Math.random() * 3);

      for (let f = 0; f < flakeCount; f++) {
        const col = colors[Math.floor(Math.random() * colors.length)];
        const mesh = createSingleSquareFlakeMesh(col);
        scene.add(mesh);

        // Increased spawn spread by 40%
        const flakeX = worldX + (Math.random() - 0.5) * 0.45;
        const flakeZ = worldZ + (Math.random() - 0.5) * 0.45;

        activeFlakes.push({
          mesh: mesh,
          x: flakeX,
          z: flakeZ,
          vx: (Math.random() - 0.5) * 0.05,
          vz: (Math.random() - 0.5) * 0.05
        });
      }
    }

    function updateFishFlakes() {
      for (let f = activeFlakes.length - 1; f >= 0; f--) {
        const flake = activeFlakes[f];

        const gx = Math.min(NX - 1, Math.max(0, Math.floor(flake.x / L)));
        const gy = Math.min(NY - 1, Math.max(0, Math.floor(flake.z / L)));
        const i = idx(gx, gy);

        const currentDepth = d[i];

        if (currentDepth <= 0.005) {
          scene.remove(flake.mesh);
          activeFlakes.splice(f, 1);
          continue;
        }

        let flowVx = Vx[i];
        let flowVy = Vy[i];

        const dR = (gx < NX - 1) ? d[idx(gx + 1, gy)] : 0;
        const dL = (gx > 0)      ? d[idx(gx - 1, gy)] : 0;
        const dU = (gy < NY - 1) ? d[idx(gx, gy + 1)] : 0;
        const dD = (gy > 0)      ? d[idx(gx, gy - 1)] : 0;

        let edgeRepelX = 0;
        let edgeRepelZ = 0;

        if (dL < 0.03) edgeRepelX += 0.25;
        if (dR < 0.03) edgeRepelX -= 0.25;
        if (dD < 0.03) edgeRepelZ += 0.25;
        if (dU < 0.03) edgeRepelZ -= 0.25;

        flake.vx += (flowVx * 0.8 + edgeRepelX) * DT * 8.0;
        flake.vz += (flowVy * 0.8 + edgeRepelZ) * DT * 8.0;

        flake.vx *= 0.90;
        flake.vz *= 0.90;

        flake.x += flake.vx * DT;
        flake.z += flake.vz * DT;

        const surfaceY = T[i] + currentDepth + 0.01;
        flake.mesh.position.set(flake.x, surfaceY, flake.z);

        if (flake.x > worldWidth + 1.0) {
          scene.remove(flake.mesh);
          activeFlakes.splice(f, 1);
        }
      }
    }

    // --- REVERTED PURE CONICAL BOID FISH SYSTEM WITH HOPPY WIGGLE ---
    const activeFish = [];
    const splashEvents = [];
    const FISH_MIN_DEPTH = 0.12;

    const BOID_SEPARATION_DIST = 0.65;
    const BOID_NEIGHBOR_RADIUS = 2.0;
    const WEIGHT_TARGET = 0.60;
    const WEIGHT_SEPARATION = 0.90;
    const WEIGHT_ALIGNMENT = 0.35;
    const WEIGHT_COHESION = 0.30;
    const BOAT_AVOID_RADIUS = 2.2;
    const DUCK_ATTRACT_RADIUS = 3.2;

    const FLAKE_ATTRACT_RADIUS = 4.5;
    const FLAKE_EAT_RADIUS = 0.32;
    const FISH_FEED_COOLDOWN = 2.0;

    function createFishMesh() {
      const fishGeo = new THREE.ConeGeometry(0.045, 0.22, 6);
      fishGeo.rotateX(Math.PI / 2);

      const fishColor = (Math.random() > 0.4) ? 0x2e7d32 : 0x1b5e20;
      const fishMat = new THREE.MeshStandardMaterial({ color: fishColor, roughness: 0.35 });
      const mesh = new THREE.Mesh(fishGeo, fishMat);

      mesh.scale.set(1.15, 1.15, 1.15);

      const fishContainer = new THREE.Group();
      fishContainer.add(mesh);

      return {
        container: fishContainer,
        bodyMesh: mesh
      };
    }

    function spawnFish() {
      const validPoints = [];
      for (let y = 5; y < NY - 5; y += 2) {
        const i = idx(2, y);
        if (d[i] >= FISH_MIN_DEPTH) {
          validPoints.push(y);
        }
      }

      if (validPoints.length === 0) return;

      const spawnY = validPoints[Math.floor(Math.random() * validPoints.length)];
      const startX = -0.5;
      const startZ = spawnY * L;

      const { container, bodyMesh } = createFishMesh();
      container.position.set(startX, 0.2, startZ);
      scene.add(container);

      activeFish.push({
        container: container,
        bodyMesh: bodyMesh,
        x: startX,
        z: startZ,
        targetX: 2 * L,
        targetZ: startZ,
        vx: 0,
        vz: 0,
        heading: 0,
        state: 'swimming',
        flopTimer: 0,
        frightTimer: 0,
        feedCooldown: 0,
        hopTargetX: null,
        hopTargetZ: null,
        swimSpeed: 0.35 + Math.random() * 0.25
      });
    }

    function findDeepWaterTarget(currentGridX, currentGridY) {
      const candidates = [];
      const searchRadius = 25;

      const minGX = Math.max(2, currentGridX - searchRadius);
      const maxGX = Math.min(NX - 3, currentGridX + searchRadius);
      const minGY = Math.max(2, currentGridY - searchRadius);
      const maxGY = Math.min(NY - 3, currentGridY + searchRadius);

      for (let gy = minGY; gy <= maxGY; gy += 2) {
        for (let gx = minGX; gx <= maxGX; gx += 2) {
          const i = idx(gx, gy);
          if (d[i] >= FISH_MIN_DEPTH) {
            candidates.push({ x: gx * L, z: gy * L });
          }
        }
      }

      if (candidates.length > 0) {
        return candidates[Math.floor(Math.random() * candidates.length)];
      }
      return null;
    }

    function updateFish() {
      for (let s = splashEvents.length - 1; s >= 0; s--) {
        splashEvents[s].duration -= DT;
        if (splashEvents[s].duration <= 0) {
          splashEvents.splice(s, 1);
        }
      }

      for (let k = activeFish.length - 1; k >= 0; k--) {
        const fish = activeFish[k];
        const gx = Math.min(NX - 1, Math.max(0, Math.floor(fish.x / L)));
        const gy = Math.min(NY - 1, Math.max(0, Math.floor(fish.z / L)));
        const i = idx(gx, gy);

        const currentDepth = d[i];
        const currentFlowVx = Vx[i];
        const currentFlowVy = Vy[i];

        if (fish.feedCooldown > 0) {
          fish.feedCooldown -= DT;
        }

        // --- STATE 1: STRANDED / HOPPY WIGGLE TOWARD WATER ---
        if (currentDepth < 0.02) {
          if (fish.state !== 'flopping') {
            fish.state = 'flopping';
            fish.flopTimer = 0;

            const escapeTarget = findDeepWaterTarget(gx, gy);
            if (escapeTarget) {
              fish.hopTargetX = escapeTarget.x;
              fish.hopTargetZ = escapeTarget.z;
            } else {
              fish.hopTargetX = fish.x + (Math.random() - 0.5) * 1.5;
              fish.hopTargetZ = fish.z + (Math.random() - 0.5) * 1.5;
            }
          }

          fish.flopTimer += DT;

          const hopCycle = (fish.flopTimer * 12.0) % (Math.PI * 2);
          const hopHeight = Math.max(0, Math.sin(hopCycle)) * 0.14;
          const groundY = TSmooth[i] || T[i];

          if (fish.hopTargetX !== null && fish.hopTargetZ !== null) {
            let dirX = fish.hopTargetX - fish.x;
            let dirZ = fish.hopTargetZ - fish.z;
            const dirLen = Math.hypot(dirX, dirZ);

            if (dirLen > 0.05) {
              dirX /= dirLen;
              dirZ /= dirLen;

              const hopProgress = Math.max(0, Math.sin(hopCycle));
              fish.x += dirX * hopProgress * DT * 0.6;
              fish.z += dirZ * hopProgress * DT * 0.6;

              const hopAngle = Math.atan2(dirZ, dirX);
              let diff = hopAngle - fish.heading;
              diff = Math.atan2(Math.sin(diff), Math.cos(diff));
              fish.heading += diff * 0.25;
              fish.container.rotation.y = -fish.heading + Math.PI / 2;
            }
          }

          fish.container.position.set(fish.x, groundY + hopHeight, fish.z);

          fish.bodyMesh.rotation.z = Math.sin(fish.flopTimer * 28.0) * 0.7;
          fish.bodyMesh.rotation.x = Math.cos(fish.flopTimer * 24.0) * 0.4;

          if (fish.flopTimer >= 2.0) {
            scene.remove(fish.container);
            activeFish.splice(k, 1);
          }
          continue;
        }

        // --- STATE 2: SWIMMING / PATHFINDING WITH ENHANCED BOIDS ---
        fish.state = 'swimming';
        fish.hopTargetX = null;
        fish.hopTargetZ = null;
        fish.bodyMesh.rotation.z = 0;
        fish.bodyMesh.rotation.x = 0;

        const targetWaterY = T[i] + currentDepth * 0.45;
        fish.container.position.y += (targetWaterY - fish.container.position.y) * 0.15;

        // Fish Flake Attraction & Feeding Logic
        let nearestFlake = null;
        let minDistToFlake = FLAKE_ATTRACT_RADIUS;

        for (let fIdx = activeFlakes.length - 1; fIdx >= 0; fIdx--) {
          const flake = activeFlakes[fIdx];
          const distF = Math.hypot(flake.x - fish.x, flake.z - fish.z);

          if (distF < FLAKE_EAT_RADIUS && fish.feedCooldown <= 0) {
            scene.remove(flake.mesh);
            activeFlakes.splice(fIdx, 1);
            fish.feedCooldown = FISH_FEED_COOLDOWN;
            continue;
          }

          if (distF < minDistToFlake && fish.feedCooldown <= 0) {
            minDistToFlake = distF;
            nearestFlake = flake;
          }
        }

        let flakeSteerVx = 0;
        let flakeSteerVz = 0;

        if (nearestFlake && fish.frightTimer <= 0 && fish.feedCooldown <= 0) {
          const dx = nearestFlake.x - fish.x;
          const dz = nearestFlake.z - fish.z;
          const force = (FLAKE_ATTRACT_RADIUS - minDistToFlake) / FLAKE_ATTRACT_RADIUS;
          flakeSteerVx = (dx / minDistToFlake) * force * 2.2;
          flakeSteerVz = (dz / minDistToFlake) * force * 2.2;
        }

        const distToTarget = Math.hypot(fish.targetX - fish.x, fish.targetZ - fish.z);

        if (distToTarget < 0.3 || Math.random() < 0.008) {
          const newTarget = findDeepWaterTarget(gx, gy);
          if (newTarget) {
            fish.targetX = newTarget.x;
            fish.targetZ = newTarget.z;
          }
        }

        let targetVx = fish.targetX - fish.x;
        let targetVz = fish.targetZ - fish.z;
        const targetLen = Math.hypot(targetVx, targetVz);

        if (targetLen > 0.05) {
          targetVx = (targetVx / targetLen) * fish.swimSpeed;
          targetVz = (targetVz / targetLen) * fish.swimSpeed;
        } else {
          targetVx = 0;
          targetVz = 0;
        }

        let sepVx = 0, sepVz = 0;
        let alignVx = 0, alignVz = 0;
        let centerx = 0, centerz = 0;
        let neighborCount = 0;

        for (let j = 0; j < activeFish.length; j++) {
          if (j === k) continue;
          const other = activeFish[j];
          if (other.state !== 'swimming') continue;

          const dx = fish.x - other.x;
          const dz = fish.z - other.z;
          const dist = Math.hypot(dx, dz);

          if (dist > 0 && dist < BOID_NEIGHBOR_RADIUS) {
            neighborCount++;

            if (dist < BOID_SEPARATION_DIST) {
              sepVx += (dx / dist) * (BOID_SEPARATION_DIST - dist);
              sepVz += (dz / dist) * (BOID_SEPARATION_DIST - dist);
            }

            alignVx += other.vx;
            alignVz += other.vz;

            centerx += other.x;
            centerz += other.z;
          }
        }

        let boidVx = 0;
        let boidVz = 0;

        if (neighborCount > 0) {
          alignVx /= neighborCount;
          alignVz /= neighborCount;

          centerx /= neighborCount;
          centerz /= neighborCount;
          let cohVx = centerx - fish.x;
          let cohVz = centerz - fish.z;
          const cohLen = Math.hypot(cohVx, cohVz);
          if (cohLen > 0) {
            cohVx = (cohVx / cohLen) * fish.swimSpeed;
            cohVz = (cohVz / cohLen) * fish.swimSpeed;
          }

          boidVx = (sepVx * WEIGHT_SEPARATION) + (alignVx * WEIGHT_ALIGNMENT) + (cohVx * WEIGHT_COHESION);
          boidVz = (sepVz * WEIGHT_SEPARATION) + (alignVz * WEIGHT_ALIGNMENT) + (cohVz * WEIGHT_COHESION);
        }

        let boatAvoidVx = 0, boatAvoidVz = 0;
        let duckAttractVx = 0, duckAttractVz = 0;

        for (let obj of floatingObjects) {
          const dx = fish.x - obj.x;
          const dz = fish.z - obj.z;
          const dist = Math.hypot(dx, dz);

          if (obj.type === 'boat' && dist < BOAT_AVOID_RADIUS && dist > 0) {
            const force = (BOAT_AVOID_RADIUS - dist) / BOAT_AVOID_RADIUS;
            boatAvoidVx += (dx / dist) * force * 1.6;
            boatAvoidVz += (dz / dist) * force * 1.6;
          } else if (obj.type === 'duck' && dist < DUCK_ATTRACT_RADIUS && dist > 0.4) {
            const force = (DUCK_ATTRACT_RADIUS - dist) / DUCK_ATTRACT_RADIUS;
            duckAttractVx -= (dx / dist) * force * 0.45;
            duckAttractVz -= (dz / dist) * force * 0.45;
          }
        }

        let fleeVx = 0, fleeVz = 0;
        for (let splash of splashEvents) {
          const dx = fish.x - splash.x;
          const dz = fish.z - splash.z;
          const dist = Math.hypot(dx, dz);

          if (dist < splash.radius && dist > 0) {
            fish.frightTimer = 1.4;
            const force = (splash.radius - dist) / splash.radius;
            fleeVx += (dx / dist) * force * 3.2;
            fleeVz += (dz / dist) * force * 3.2;
          }
        }

        if (fish.frightTimer > 0) {
          fish.frightTimer -= DT;
        }

        let desiredVx = targetVx * WEIGHT_TARGET + boidVx + boatAvoidVx + duckAttractVx + flakeSteerVx + fleeVx;
        let desiredVz = targetVz * WEIGHT_TARGET + boidVz + boatAvoidVz + duckAttractVz + flakeSteerVz + fleeVz;
        const totalLen = Math.hypot(desiredVx, desiredVz);

        const effectiveSpeed = (fish.frightTimer > 0) ? fish.swimSpeed * 2.0 : fish.swimSpeed;

        if (totalLen > 0.05) {
          desiredVx = (desiredVx / totalLen) * effectiveSpeed;
          desiredVz = (desiredVz / totalLen) * effectiveSpeed;

          fish.vx += (desiredVx - fish.vx) * (fish.frightTimer > 0 ? 0.22 : 0.08);
          fish.vz += (desiredVz - fish.vz) * (fish.frightTimer > 0 ? 0.22 : 0.08);
        } else {
          fish.vx *= 0.90;
          fish.vz *= 0.90;
        }

        const lookAheadX = fish.x + fish.vx * 0.8;
        const lookAheadZ = fish.z + fish.vz * 0.8;
        const laGx = Math.min(NX - 1, Math.max(0, Math.floor(lookAheadX / L)));
        const laGy = Math.min(NY - 1, Math.max(0, Math.floor(lookAheadZ / L)));

        if (d[idx(laGx, laGy)] < FISH_MIN_DEPTH) {
          const escapeTarget = findDeepWaterTarget(gx, gy);
          if (escapeTarget) {
            fish.targetX = escapeTarget.x;
            fish.targetZ = escapeTarget.z;
          }
        }

        fish.x += fish.vx * DT;
        fish.z += fish.vz * DT;

        fish.container.position.x = fish.x;
        fish.container.position.z = fish.z;

        const actualSpeed = Math.hypot(fish.vx, fish.vz);

        let targetAngle = fish.heading;
        if (actualSpeed > 0.04) {
          targetAngle = Math.atan2(fish.vz, fish.vx);
        } else {
          const currentSpeed = Math.hypot(currentFlowVx, currentFlowVy);
          if (currentSpeed > 0.05) {
            targetAngle = Math.atan2(-currentFlowVy, -currentFlowVx);
          }
        }

        let angleDiff = targetAngle - fish.heading;
        angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
        fish.heading += angleDiff * (fish.frightTimer > 0 ? 0.28 : 0.12);
        fish.container.rotation.y = -fish.heading + Math.PI / 2;

        if (fish.x > worldWidth + 0.8) {
          scene.remove(fish.container);
          activeFish.splice(k, 1);
        }
      }
    }

    // --- WATER SIMULATION STEP ---
    function stepWaterSimulation() {
      for (let i = 0; i < size; i++) {
        H[i] = T[i] + d[i];
      }

      const factor = DT * PIPE_A * G / L;
      for (let y = 0; y < NY; y++) {
        for (let x = 0; x < NX; x++) {
          const i = idx(x, y);

          if (x > 0) {
            fL[i] = Math.max(0, (fL[i] + factor * (H[i] - H[idx(x - 1, y)])) * DAMPING);
          } else { fL[i] = 0; }

          if (x < NX - 1) {
            fR[i] = Math.max(0, (fR[i] + factor * (H[i] - H[idx(x + 1, y)])) * DAMPING);
          } else {
            fR[i] = Math.max(0, (fR[i] + factor * DRAIN_SPEED_MULT * (H[i] - 0)) * DAMPING);
          }

          if (y > 0) {
            fD[i] = Math.max(0, (fD[i] + factor * (H[i] - H[idx(x, y - 1)])) * DAMPING);
          } else { fD[i] = 0; }

          if (y < NY - 1) {
            fU[i] = Math.max(0, (fU[i] + factor * (H[i] - H[idx(x, y + 1)])) * DAMPING);
          } else { fU[i] = 0; }
        }
      }

      for (let i = 0; i < size; i++) {
        const totalOutflow = (fL[i] + fR[i] + fD[i] + fU[i]) * DT;
        const currentVolume = d[i] * L * L;

        if (totalOutflow > currentVolume && totalOutflow > 0) {
          const scale = currentVolume / totalOutflow;
          fL[i] *= scale;
          fR[i] *= scale;
          fD[i] *= scale;
          fU[i] *= scale;
        }
      }

      for (let y = 0; y < NY; y++) {
        for (let x = 0; x < NX; x++) {
          const i = idx(x, y);

          const inL = (x < NX - 1) ? fL[idx(x + 1, y)] : 0;
          const inR = (x > 0)      ? fR[idx(x - 1, y)] : 0;
          const inD = (y < NY - 1) ? fD[idx(x, y + 1)] : 0;
          const inU = (y > 0)      ? fU[idx(x, y - 1)] : 0;

          const netVolume = ((inL + inR + inD + inU) - (fL[i] + fR[i] + fD[i] + fU[i])) * DT;
          d[i] += netVolume / (L * L);
          if (d[i] < 0.0001) d[i] = 0;
        }
      }

      for (let y = 0; y < NY; y++) {
        const iSource = idx(0, y);
        d[iSource] = Math.max(0, SOURCE_DEPTH - T[iSource]);

        const iSink = idx(NX - 1, y);
        d[iSink] = 0;
      }

      for (let y = 0; y < NY; y++) {
        for (let x = 0; x < NX; x++) {
          const i = idx(x, y);
          if (d[i] < 0.001) {
            Vx[i] = 0;
            Vy[i] = 0;
            continue;
          }

          const inR = (x > 0) ? fR[idx(x - 1, y)] : 0;
          const inL = (x < NX - 1) ? fL[idx(x + 1, y)] : 0;
          const inU = (y > 0) ? fU[idx(x, y - 1)] : 0;
          const inD = (y < NY - 1) ? fD[idx(x, y + 1)] : 0;

          const netFx = (inR - fL[i]) + (fR[i] - inL);
          const netFy = (inU - fD[i]) + (fU[i] - inD);

          Vx[i] = netFx / (2 * d[i] * L);
          Vy[i] = netFy / (2 * d[i] * L);
        }
      }
    }

    // --- MESH & SHRUB/FLOWER UPDATE ---
    const sandColor = new THREE.Color(0xf4d06f);
    const vibrantGrassColor = new THREE.Color(0x55a630);

    function updateFoliageGroup(candidates, instancedMesh, yOffset = 0.1) {
      for (let k = 0; k < candidates.length; k++) {
        const item = candidates[k];
        const i = idx(item.x, item.y);
        const smoothT = TSmooth[i];

        if (smoothT > HIGH_PEAK_THRESHOLD && d[i] < 0.02) {
          const posX = item.x * L + item.offsetX;
          const posZ = item.y * L + item.offsetZ;
          
          dummyMatrix.makeTranslation(posX, smoothT + yOffset, posZ);
          dummyMatrix.scale(new THREE.Vector3(item.scale, item.scale, item.scale));
          instancedMesh.setMatrixAt(k, dummyMatrix);
        } else {
          dummyMatrix.makeScale(0, 0, 0);
          instancedMesh.setMatrixAt(k, dummyMatrix);
        }
      }
      instancedMesh.instanceMatrix.needsUpdate = true;
    }

    function updateMeshes() {
      for (let y = 1; y < NY - 1; y++) {
        for (let x = 1; x < NX - 1; x++) {
          const i = idx(x, y);
          TSmooth[i] = (
            T[i] * 0.4 +
            (T[idx(x + 1, y)] + T[idx(x - 1, y)] + T[idx(x, y + 1)] + T[idx(x, y - 1)]) * 0.15
          );
        }
      }

      const gPos = groundGeo.attributes.position;
      const gColor = groundGeo.attributes.color;
      const wPos = waterGeo.attributes.position;
      const wDepth = waterGeo.attributes.waterDepth;

      for (let y = 0; y < NY; y++) {
        for (let x = 0; x < NX; x++) {
          const i = idx(x, y);
          const vertexIdx = i;

          const smoothT = (x > 0 && x < NX - 1 && y > 0 && y < NY - 1) ? TSmooth[i] : T[i];
          gPos.setY(vertexIdx, smoothT);

          const blendFactor = THREE.MathUtils.clamp((smoothT - 1.75) / 0.25, 0, 1);
          const c = sandColor.clone().lerp(vibrantGrassColor, blendFactor);
          gColor.setXYZ(vertexIdx, c.r, c.g, c.b);

          wDepth.setX(vertexIdx, d[i]);

          if (d[i] > 0.001) {
            wPos.setY(vertexIdx, smoothT + d[i]);
          } else {
            wPos.setY(vertexIdx, smoothT - 0.02);
          }
        }
      }

      // Adaptive Ground Mesh Triangulation
      const gIndices = groundGeo.index.array;
      let gPtr = 0;

      for (let y = 0; y < NY - 1; y++) {
        for (let x = 0; x < NX - 1; x++) {
          const a = idx(x, y);
          const b = idx(x + 1, y);
          const c = idx(x, y + 1);
          const dCorner = idx(x + 1, y + 1);

          const hA = (x > 0 && x < NX - 1 && y > 0 && y < NY - 1) ? TSmooth[a] : T[a];
          const hB = (x + 1 > 0 && x + 1 < NX - 1 && y > 0 && y < NY - 1) ? TSmooth[b] : T[b];
          const hC = (x > 0 && x < NX - 1 && y + 1 > 0 && y + 1 < NY - 1) ? TSmooth[c] : T[c];
          const hD = (x + 1 > 0 && x + 1 < NX - 1 && y + 1 > 0 && y + 1 < NY - 1) ? TSmooth[dCorner] : T[dCorner];

          const diffAD = Math.abs(hA - hD);
          const diffBC = Math.abs(hB - hC);

          if (diffAD < diffBC) {
            gIndices[gPtr++] = a;
            gIndices[gPtr++] = c;
            gIndices[gPtr++] = dCorner;

            gIndices[gPtr++] = a;
            gIndices[gPtr++] = dCorner;
            gIndices[gPtr++] = b;
          } else {
            gIndices[gPtr++] = a;
            gIndices[gPtr++] = c;
            gIndices[gPtr++] = b;

            gIndices[gPtr++] = b;
            gIndices[gPtr++] = c;
            gIndices[gPtr++] = dCorner;
          }
        }
      }
      groundGeo.index.needsUpdate = true;

      // Adaptive Water Mesh Triangulation
      const indices = waterGeo.index.array;
      let ptr = 0;

      for (let y = 0; y < NY - 1; y++) {
        for (let x = 0; x < NX - 1; x++) {
          const a = idx(x, y);
          const b = idx(x + 1, y);
          const c = idx(x, y + 1);
          const dCorner = idx(x + 1, y + 1);

          const diffAD = Math.abs(d[a] - d[dCorner]);
          const diffBC = Math.abs(d[b] - d[c]);

          if (diffAD < diffBC) {
            indices[ptr++] = a;
            indices[ptr++] = c;
            indices[ptr++] = dCorner;

            indices[ptr++] = a;
            indices[ptr++] = dCorner;
            indices[ptr++] = b;
          } else {
            indices[ptr++] = a;
            indices[ptr++] = c;
            indices[ptr++] = b;

            indices[ptr++] = b;
            indices[ptr++] = c;
            indices[ptr++] = dCorner;
          }
        }
      }
      waterGeo.index.needsUpdate = true;

      const extPos = waterExtGeo.attributes.position;
      for (let y = 0; y < NY; y++) {
        const iSink = idx(NX - 1, y);
        const edgeT = (TSmooth[iSink] || T[iSink]);
        const edgeD = d[iSink];
        const surfaceH = edgeT + Math.max(edgeD, 0.02);

        extPos.setY(y * 2, surfaceH);
        extPos.setY(y * 2 + 1, surfaceH - 0.5);
      }
      extPos.needsUpdate = true;
      waterExtGeo.computeVertexNormals();

      gPos.needsUpdate = true;
      gColor.needsUpdate = true;
      wPos.needsUpdate = true;
      wDepth.needsUpdate = true;
      groundGeo.computeVertexNormals();
      waterGeo.computeVertexNormals();

      updateFoliageGroup(shrubCandidates, shrubInstanced, 0.12);
      updateFoliageGroup(pinkFlowerCandidates, pinkFlowerInstanced, 0.06);
      updateFoliageGroup(yellowFlowerCandidates, yellowFlowerInstanced, 0.06);

      placedTools.forEach(tool => {
        if (!tool.isHeld) {
          const gx = Math.min(NX - 1, Math.max(0, Math.floor(tool.x / L)));
          const gy = Math.min(NY - 1, Math.max(0, Math.floor(tool.z / L)));
          const groundY = TSmooth[idx(gx, gy)] || T[idx(gx, gy)];
          tool.mesh.position.set(tool.x, groundY + 0.2, tool.z);
        }
      });
    }

    // --- ITEM PHYSICS & FROG JUMPING / FLOATING ---
    function updateFloatingObjects() {
      for (let k = floatingObjects.length - 1; k >= 0; k--) {
        const obj = floatingObjects[k];
        if (obj.isHeld) continue;

        const gx = Math.min(NX - 1, Math.max(0, Math.floor(obj.x / L)));
        const gy = Math.min(NY - 1, Math.max(0, Math.floor(obj.z / L)));
        const i = idx(gx, gy);

        const currentDepth = d[i];
        const waterSurface = T[i] + currentDepth;

        let flowVx = Vx[i];
        let flowVy = Vy[i];
        if (obj.x >= (NX - 2) * L) {
          flowVx = Math.max(flowVx, 0.45);
        }

        if (obj.type === 'rock') {
          const targetY = T[i] + 0.12;
          obj.mesh.position.y += (targetY - obj.mesh.position.y) * 0.18;

          const tR = (gx < NX - 1) ? T[idx(gx + 1, gy)] : T[i];
          const tL = (gx > 0)      ? T[idx(gx - 1, gy)] : T[i];
          const tU = (gy < NY - 1) ? T[idx(gx, gy + 1)] : T[i];
          const tD = (gy > 0)      ? T[idx(gx, gy - 1)] : T[i];

          const slopeX = (tL - tR);
          const slopeZ = (tD - tU);

          obj.vx += slopeX * 0.10;
          obj.vz += slopeZ * 0.10;

          const speed = Math.sqrt(flowVx * flowVx + flowVy * flowVy);
          if (currentDepth > 0.02 && speed > 0.12) {
            obj.vx += flowVx * 0.015 * ITEM_SPEED_MULTIPLIER;
            obj.vz += flowVy * 0.015 * ITEM_SPEED_MULTIPLIER;
          }

          const rollSpeed = Math.sqrt(obj.vx * obj.vx + obj.vz * obj.vz);
          if (rollSpeed > 0.005) {
            obj.rotationAngle += rollSpeed * 0.35;
            obj.mesh.rotation.x = obj.rotationAngle;
            obj.mesh.rotation.z += obj.vx * 0.15;
          }

          obj.vx *= 0.92;
          obj.vz *= 0.92;
        } 
        else if (obj.type === 'duck') {
          const isFloating = currentDepth > 0.015 || obj.x >= (NX - 2) * L;
          const targetY = isFloating ? waterSurface : T[i];

          obj.mesh.position.y += (targetY - obj.mesh.position.y) * 0.15;

          if (isFloating) {
            obj.vx += flowVx * 0.030 * ITEM_SPEED_MULTIPLIER;
            obj.vz += flowVy * 0.030 * ITEM_SPEED_MULTIPLIER;

            if (gx < NX - 4 && currentDepth < 0.12) {
              const dR = (gx < NX - 1) ? d[idx(gx + 1, gy)] : 0;
              const dL = (gx > 0)      ? d[idx(gx - 1, gy)] : 0;
              const dU = (gy < NY - 1) ? d[idx(gx, gy + 1)] : 0;
              const dD = (gy > 0)      ? d[idx(gx, gy - 1)] : 0;

              const gradX = dR - dL;
              const gradY = dU - dD;

              obj.vx += gradX * 0.20;
              obj.vz += gradY * 0.20;
            }

            const targetAngle = Math.atan2(flowVy, flowVx);
            let angleDiff = targetAngle - obj.rotationAngle;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
            obj.rotationAngle += angleDiff * 0.20;
            obj.mesh.rotation.y = -obj.rotationAngle;
          }

          obj.vx *= 0.91;
          obj.vz *= 0.91;
        } 
        else if (obj.type === 'boat') {
          const minBoatDepth = 0.07;
          const isFloating = currentDepth > minBoatDepth || obj.x >= (NX - 2) * L;
          const targetY = isFloating ? waterSurface + 0.075 : T[i] + 0.03;

          obj.mesh.position.y += (targetY - obj.mesh.position.y) * 0.15;

          if (isFloating) {
            obj.vx += flowVx * 0.052 * ITEM_SPEED_MULTIPLIER;
            obj.vz += flowVy * 0.052 * ITEM_SPEED_MULTIPLIER;

            const targetAngle = Math.atan2(flowVy, flowVx);
            let angleDiff = targetAngle - obj.rotationAngle;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
            obj.rotationAngle += angleDiff * 0.04;
            obj.mesh.rotation.y = -obj.rotationAngle;

            obj.vx *= 0.94;
            obj.vz *= 0.94;
          } else {
            obj.vx *= 0.50; 
            obj.vz *= 0.50;
          }
        }
        else if (obj.type === 'frog_lilypad') {
          const targetY = (currentDepth > 0.01) ? waterSurface : T[i];
          obj.mesh.position.y += (targetY - obj.mesh.position.y) * 0.15;

          obj.vx += flowVx * 0.035 * ITEM_SPEED_MULTIPLIER;
          obj.vz += flowVy * 0.035 * ITEM_SPEED_MULTIPLIER;

          const targetAngle = Math.atan2(flowVy, flowVx);
          let angleDiff = targetAngle - obj.rotationAngle;
          angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
          obj.rotationAngle += angleDiff * 0.10;
          obj.mesh.rotation.y = -obj.rotationAngle;

          obj.vx *= 0.92;
          obj.vz *= 0.92;

          // --- FROG JUMP MOTION ENGINE WITH VISUALLY ATTACHED LEGS ---
          if (obj.isFrogJumping && obj.hasFrog) {
            obj.jumpProgress += DT * 1.8;
            const frogSubGroup = obj.mesh.getObjectByName('frogGroup');
            
            if (frogSubGroup) {
              const p = Math.min(1.0, obj.jumpProgress);

              const jumpArcY = Math.sin(p * Math.PI) * 0.85;
              const forwardZ = p * 0.75;

              frogSubGroup.position.y = 0.08 + jumpArcY;
              frogSubGroup.position.z = forwardZ;

              frogSubGroup.rotation.x = Math.sin((p - 0.25) * Math.PI) * -0.65;

              const leftLeg = frogSubGroup.getObjectByName('leftLegGroup');
              const rightLeg = frogSubGroup.getObjectByName('rightLegGroup');

              if (leftLeg && rightLeg) {
                if (p < 0.25) {
                  const crouch = (p / 0.25);
                  leftLeg.rotation.x = crouch * 0.65;
                  rightLeg.rotation.x = crouch * 0.65;
                } else if (p < 0.75) {
                  leftLeg.rotation.x = -1.15;
                  rightLeg.rotation.x = -1.15;
                } else {
                  const land = (p - 0.75) / 0.25;
                  leftLeg.rotation.x = -1.15 + land * 1.15;
                  rightLeg.rotation.x = -1.15 + land * 1.15;
                }
              }

              if (p >= 0.85 && !obj.splashEmitted) {
                obj.splashEmitted = true;
                const splashWorldX = obj.x;
                const splashWorldZ = obj.z + forwardZ;

                createSplashEffect(splashWorldX, targetY + 0.05, splashWorldZ);

                splashEvents.push({
                  x: splashWorldX,
                  z: splashWorldZ,
                  radius: 3.8,
                  duration: 0.95
                });
              }

              if (p > 0.85) {
                const fadeScale = Math.max(0, 1 - (p - 0.85) * 6.6) * 1.8;
                frogSubGroup.scale.set(fadeScale, fadeScale, fadeScale);
              }

              if (p >= 1.0) {
                obj.mesh.remove(frogSubGroup);
                obj.hasFrog = false;
                obj.isFrogJumping = false;
              }
            }
          }
        }

        obj.x += obj.vx * DT;
        obj.z += obj.vz * DT;

        obj.x = Math.max(0.5 * L, obj.x);
        obj.z = Math.max(0.5 * L, Math.min((NY - 1.5) * L, obj.z));

        obj.mesh.position.x = obj.x;
        obj.mesh.position.z = obj.z;

        if (obj.x > worldWidth + 2.5) {
          scene.remove(obj.mesh);
          floatingObjects.splice(k, 1);
        }
      }
    }

    // --- MULTI-TOUCH DRAG & DROP ENGINE ---
    const raycaster = new THREE.Raycaster();
    const touchVector = new THREE.Vector2();

    const activePointers = new Map();

    function isPointerOverUI(clientX, clientY) {
      const palettes = document.querySelectorAll('.ui-palette');
      for (let palette of palettes) {
        const rect = palette.getBoundingClientRect();
        if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
          return true;
        }
      }
      return false;
    }

    function applySculpting(point, mult, brushRadius = 10) {
      const strength = 0.05;

      const centerGridX = point.x / L;
      const centerGridY = point.z / L;

      const rCells = Math.ceil(brushRadius);
      const minX = Math.max(1, Math.floor(centerGridX - rCells));
      const maxX = Math.min(NX - 2, Math.ceil(centerGridX + rCells));
      const minY = Math.max(1, Math.floor(centerGridY - rCells));
      const maxY = Math.min(NY - 2, Math.ceil(centerGridY + rCells));

      for (let y = minY; y <= maxY; y++) {
        for (let x = minX; x <= maxX; x++) {
          const dx = x - centerGridX;
          const dy = y - centerGridY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < brushRadius) {
            const falloff = 0.5 * (1 + Math.cos((dist / brushRadius) * Math.PI));
            const i = idx(x, y);
            T[i] += mult * strength * falloff;
            T[i] = Math.max(-1.0, Math.min(5.0, T[i]));
          }
        }
      }
    }

    function raycastGround(clientX, clientY) {
      touchVector.x = (clientX / window.innerWidth) * 2 - 1;
      touchVector.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(touchVector, camera);
      const intersects = raycaster.intersectObject(groundMesh);

      if (intersects.length > 0) {
        return intersects[0].point;
      }
      return null;
    }

    function raycastPlacedTools(clientX, clientY) {
      touchVector.x = (clientX / window.innerWidth) * 2 - 1;
      touchVector.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(touchVector, camera);
      const toolMeshes = placedTools.filter(t => !t.isHeld).map(t => t.mesh);
      const intersects = raycaster.intersectObjects(toolMeshes, true);

      if (intersects.length > 0) {
        let topMesh = intersects[0].object;
        while (topMesh.parent && topMesh.parent !== scene) {
          topMesh = topMesh.parent;
        }
        return placedTools.find(t => t.mesh === topMesh);
      }
      return null;
    }

    function raycastFloatingItem(clientX, clientY) {
      touchVector.x = (clientX / window.innerWidth) * 2 - 1;
      touchVector.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(touchVector, camera);
      const itemMeshes = floatingObjects.filter(o => !o.isHeld).map(o => o.mesh);
      const intersects = raycaster.intersectObjects(itemMeshes, true);

      if (intersects.length > 0) {
        let topMesh = intersects[0].object;
        while (topMesh.parent && topMesh.parent !== scene) {
          topMesh = topMesh.parent;
        }
        return floatingObjects.find(o => o.mesh === topMesh);
      }
      return null;
    }

    document.querySelectorAll('.draggable-card').forEach(card => {
      card.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();

        const type = card.getAttribute('data-type');
        card.setPointerCapture(e.pointerId);

        const hitPos = raycastGround(e.clientX, e.clientY);
        const proxyMesh = create3DToolMesh(type);
        
        if (hitPos) {
          const hoverY = ['duck', 'boat', 'rock', 'fish_flakes'].includes(type) ? hitPos.y + 0.8 : hitPos.y + 0.35;
          proxyMesh.position.set(hitPos.x, hoverY, hitPos.z);
          proxyMesh.visible = !isPointerOverUI(e.clientX, e.clientY);
        } else {
          proxyMesh.visible = false;
        }

        activePointers.set(e.pointerId, {
          action: 'place_from_palette',
          type: type,
          worldPos: hitPos,
          mesh: proxyMesh,
          targetObj: null,
          lastX: hitPos ? hitPos.x : null,
          lastZ: hitPos ? hitPos.z : null,
          targetAngle: 0,
          currentAngle: 0
        });
      });
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.ui-palette')) return;

      const hitTool = raycastPlacedTools(e.clientX, e.clientY);
      const hitItem = raycastFloatingItem(e.clientX, e.clientY);
      const hitPos = raycastGround(e.clientX, e.clientY);

      if (hitItem && hitItem.type === 'frog_lilypad' && hitItem.hasFrog && !hitItem.isFrogJumping) {
        hitItem.isFrogJumping = true;
        hitItem.jumpProgress = 0;
      }

      if (hitTool) {
        hitTool.isHeld = true;
        activePointers.set(e.pointerId, {
          action: 'use_placed_tool',
          type: hitTool.type,
          worldPos: hitPos || new THREE.Vector3(hitTool.x, 1, hitTool.z),
          mesh: null,
          targetObj: hitTool,
          lastX: hitPos ? hitPos.x : hitTool.x,
          lastZ: hitPos ? hitPos.z : hitTool.z,
          targetAngle: hitTool.mesh.rotation.y,
          currentAngle: hitTool.mesh.rotation.y
        });
      } else if (hitItem) {
        hitItem.isHeld = true;
        hitItem.vx = 0;
        hitItem.vz = 0;

        activePointers.set(e.pointerId, {
          action: 'move_toy',
          type: hitItem.type,
          worldPos: hitPos || new THREE.Vector3(hitItem.x, 1, hitItem.z),
          mesh: null,
          targetObj: hitItem
        });
      } else if (hitPos) {
        addWaterDisturbance(hitPos.x, hitPos.z, 0.18, 5);
        activePointers.set(e.pointerId, {
          action: 'touch_water',
          type: 'water',
          worldPos: hitPos,
          targetObj: null
        });
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (activePointers.has(e.pointerId)) {
        const pointerData = activePointers.get(e.pointerId);
        const overUI = isPointerOverUI(e.clientX, e.clientY);
        const hitPos = raycastGround(e.clientX, e.clientY);

        if (pointerData.action === 'place_from_palette') {
          if (hitPos) {
            pointerData.worldPos = hitPos;
            if (pointerData.mesh) {
              pointerData.mesh.visible = !overUI;

              const hoverY = ['duck', 'boat', 'rock', 'fish_flakes'].includes(pointerData.type) ? hitPos.y + 0.8 : hitPos.y + 0.35;
              pointerData.mesh.position.set(hitPos.x, hoverY, hitPos.z);
            }

            if (pointerData.lastX !== null) {
              const dx = hitPos.x - pointerData.lastX;
              const dz = hitPos.z - pointerData.lastZ;
              if (Math.hypot(dx, dz) > 0.02) {
                pointerData.targetAngle = Math.atan2(dz, dx);
              }
            }
            pointerData.lastX = hitPos.x;
            pointerData.lastZ = hitPos.z;
          }
        } 
        else if (pointerData.action === 'use_placed_tool' && pointerData.targetObj) {
          if (hitPos) {
            pointerData.worldPos.copy(hitPos);
            pointerData.targetObj.x = hitPos.x;
            pointerData.targetObj.z = hitPos.z;
            pointerData.targetObj.mesh.position.set(hitPos.x, hitPos.y + 0.35, hitPos.z);

            if (pointerData.lastX !== null) {
              const dx = hitPos.x - pointerData.lastX;
              const dz = hitPos.z - pointerData.lastZ;
              if (Math.hypot(dx, dz) > 0.02) {
                pointerData.targetAngle = Math.atan2(dz, dx);
              }
            }
            pointerData.lastX = hitPos.x;
            pointerData.lastZ = hitPos.z;
          }
        }
        else if (pointerData.action === 'move_toy' && pointerData.targetObj) {
          if (hitPos) {
            pointerData.worldPos.copy(hitPos);
            pointerData.targetObj.x = hitPos.x;
            pointerData.targetObj.z = hitPos.z;
            pointerData.targetObj.mesh.position.set(hitPos.x, hitPos.y + 0.8, hitPos.z);
          }
        }
        else if (pointerData.action === 'touch_water') {
          if (hitPos) {
            addWaterDisturbance(hitPos.x, hitPos.z, 0.08, 4);
          }
        }
      }
    });

    function releasePointer(e) {
      if (activePointers.has(e.pointerId)) {
        const pointerData = activePointers.get(e.pointerId);
        const overUI = isPointerOverUI(e.clientX, e.clientY);

        if (pointerData.action === 'place_from_palette') {
          if (pointerData.worldPos && !overUI) {
            if (['shovel', 'bucket'].includes(pointerData.type)) {
              spawnPlacedTool(pointerData.type, pointerData.worldPos.x, pointerData.worldPos.z);
            } else if (pointerData.type === 'fish_flakes') {
              spawnFishFlakes(pointerData.worldPos.x, pointerData.worldPos.z);
            } else {
              const newItem = spawnItem(pointerData.type, pointerData.worldPos.x, pointerData.worldPos.z);
              newItem.mesh.position.set(pointerData.worldPos.x, pointerData.worldPos.y + 0.8, pointerData.worldPos.z);
            }
          }
          if (pointerData.mesh) scene.remove(pointerData.mesh);
        }

        if (pointerData.action === 'use_placed_tool' && pointerData.targetObj) {
          scene.remove(pointerData.targetObj.mesh);
          const toolIndex = placedTools.indexOf(pointerData.targetObj);
          if (toolIndex !== -1) placedTools.splice(toolIndex, 1);
        }

        if (pointerData.action === 'move_toy' && pointerData.targetObj) {
          pointerData.targetObj.isHeld = false;
        }

        activePointers.delete(e.pointerId);
      }
    }

    window.addEventListener('pointerup', releasePointer);
    window.addEventListener('pointercancel', releasePointer);

    function processActiveTools() {
      activePointers.forEach(pointerData => {
        let meshToRotate = null;
        if (pointerData.action === 'use_placed_tool' && pointerData.targetObj) {
          meshToRotate = pointerData.targetObj.mesh;
        } else if (pointerData.action === 'place_from_palette' && pointerData.mesh && ['shovel', 'bucket'].includes(pointerData.type)) {
          meshToRotate = pointerData.mesh;
        }

        if (meshToRotate && pointerData.targetAngle !== undefined) {
          let diff = pointerData.targetAngle - pointerData.currentAngle;
          diff = Math.atan2(Math.sin(diff), Math.cos(diff));
          pointerData.currentAngle += diff * 0.18;
          meshToRotate.rotation.y = pointerData.currentAngle;
        }

        if (pointerData.action === 'use_placed_tool' && pointerData.worldPos) {
          if (pointerData.type === 'shovel') {
            applySculpting(pointerData.worldPos, -1, 10);
          } else if (pointerData.type === 'bucket') {
            applySculpting(pointerData.worldPos, 1, 10);
          }
        }
      });
    }

    // --- RANDOM FROG LILYPAD SPAWNER ---
    let nextFrogSpawnTime = Date.now() + (12000 + Math.random() * 15000);

    function checkFrogSpawning() {
      if (Date.now() >= nextFrogSpawnTime) {
        const activeFrogPads = floatingObjects.filter(o => o.type === 'frog_lilypad').length;
        
        if (activeFrogPads <= 2) {
          const centerY = (NY / 2) + Math.sin(0) * (NY * 0.22);
          const spawnZ = (centerY + (Math.random() - 0.5) * 8.0) * L;
          spawnItem('frog_lilypad', 0.8 * L, spawnZ);
        }

        nextFrogSpawnTime = Date.now() + (20000 + Math.random() * 40000);
      }
    }

    window.addEventListener('resize', updateCameraFrustum);

    // --- INITIALIZATION & WARMUP PASS ---
    for (let s = 0; s < 150; s++) {
      stepWaterSimulation();
    }
    updateMeshes();

    // --- MAIN ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      processActiveTools();
      checkFrogSpawning();
      checkFishSpawning();

      for (let s = 0; s < 2; s++) {
        stepWaterSimulation();
      }

      updateMeshes();
      updateFloatingObjects();
      updateFish();
      updateFishFlakes();
      updateSplashEffects();

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
